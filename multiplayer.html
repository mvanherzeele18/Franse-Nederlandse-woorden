<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multiplayer</title>

<style>

:root {
  --green: #6BBE3A;
  --green-light: #D4E8B8;
  --green-dark: #2E7D32;
  --yellow: #FDD835;
  --bg: #F1F8E9;
  --white: #FFFFFF;
  --shadow: 0 2px 8px rgba(0,0,0,0.1);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'DM Sans',sans-serif;
  background:linear-gradient(
    135deg,
    var(--bg) 0%,
    #e8f5e9 100%
  );
  color:var(--green-dark);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

header{
  background:linear-gradient(
    135deg,
    var(--green-dark) 0%,
    var(--green) 100%
  );
  padding:2rem;
  border-bottom:4px solid var(--yellow);
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:1rem;
  box-shadow:var(--shadow);
}

header h1{
  font-family:'Playfair Display',serif;
  color:var(--yellow);
  font-size:2rem;
}

.nav-btn{
  background:var(--yellow);
  color:var(--green-dark);
  text-decoration:none;
  padding:0.7rem 1.3rem;
  border-radius:8px;
  font-weight:600;
  transition:.3s;
}

.nav-btn:hover{
  background:white;
  transform:translateY(-2px);
}

/* MAIN */

main{
  flex:1;
  max-width:900px;
  width:100%;
  margin:2rem auto;
  padding:0 1rem;
}

.box{
  background:white;
  border-radius:16px;
  padding:2rem;
  box-shadow:var(--shadow);
}

h2{
  color:var(--green-dark);
  margin-bottom:1rem;
}

/* FORM */

label{
  display:block;
  margin-bottom:.4rem;
  font-weight:600;
}

select,
input{
  width:100%;
  padding:.8rem;
  border:2px solid var(--green-light);
  border-radius:10px;
  font-size:1rem;
  margin-bottom:1rem;
}

select:focus,
input:focus{
  outline:none;
  border-color:var(--green);
}

/* BUTTONS */

button{
  border:none;
  border-radius:10px;
  padding:.9rem 1.4rem;
  cursor:pointer;
  font-weight:600;
  transition:.3s;
}

#createGame{
  background:var(--green);
  color:white;
}

#createGame:hover{
  background:var(--green-dark);
}

#stopGame{
  background:#d32f2f;
  color:white;
}

#stopGame:hover{
  background:#b71c1c;
}

#joinBtn{
  background:var(--yellow);
  color:var(--green-dark);
}

#joinBtn:hover{
  background:#fbc02d;
}

/* CODE */

.code{
  margin-top:1.5rem;
  text-align:center;
  font-size:3rem;
  font-weight:bold;
  color:var(--green-dark);
  background:var(--green-light);
  padding:1rem;
  border-radius:12px;
}

/* LEADERBOARD */

#leaderboardSection{
  margin-top:2rem;
}

.player{
  background:linear-gradient(
    135deg,
    var(--green-light) 0%,
    #c8e6c9 100%
  );
  padding:1rem;
  border-radius:12px;
  margin-bottom:.8rem;
  border-left:5px solid var(--green);
}

.player b{
  color:var(--green-dark);
  font-size:1.1rem;
}

/* FOOTER */

footer{
  text-align:center;
  padding:2rem;
  color:var(--green-dark);
  font-size:.9rem;
}

/* MOBILE */

@media(max-width:600px){

  header{
    flex-direction:column;
    align-items:stretch;
  }

  .nav-btn{
    text-align:center;
  }

  .box{
    padding:1.5rem;
  }

  .code{
    font-size:2rem;
  }

}

</style>
</head>
<body>

<div class="box">

<h1>Multiplayer</h1>

<div id="teacherPanel">

<h2>Leerkracht</h2>

<label>Jaar</label>

<select id="yearSelect">

<option value="3dejaar">
3de jaar
</option>

<option value="4dejaar">
4de jaar
</option>

</select>

<br><br>

<label>Oefening</label>

<select id="exerciseSelect">

<option value="nl-fr-dossier1">
NL → FR Dossier 1
</option>

<option value="nl-fr-dossier2">
NL → FR Dossier 2
</option>

<option value="nl-fr-dossier3">
NL → FR Dossier 3
</option>

<option value="nl-fr-dossier4">
NL → FR Dossier 4
</option>

<option value="nl-fr-dossier5">
NL → FR Dossier 5
</option>

<option value="fr-nl-dossier1">
FR → NL Dossier 1
</option>

<option value="fr-nl-dossier2">
FR → NL Dossier 2
</option>

<option value="fr-nl-dossier3">
FR → NL Dossier 3
</option>

<option value="fr-nl-dossier4">
FR → NL Dossier 4
</option>

<option value="fr-nl-dossier5">
FR → NL Dossier 5
</option>

</select>

<br><br>

<button id="createGame">
Groep aanmaken
</button>

<button id="stopGame">
Sessie stoppen
</button>

<div id="generatedCode"></div>

<div
id="leaderboardSection"
style="display:none;margin-top:2rem;"
>

<h2>
Live Scorebord
</h2>

<div id="playersList">
Nog geen spelers
</div>

</div>

</div>

<h2>Leerling</h2>

<input
id="joinCode"
placeholder="Groepscode"
>

<button id="joinBtn">
Deelnemen
</button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
updateDoc,
collection,
query,
orderBy,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyBS7uI4tD1XihrIbK2p1cNYGk4b1ipLg3o",
authDomain:"vocabulairesite.firebaseapp.com",
projectId:"vocabulairesite",
storageBucket:"vocabulairesite.firebasestorage.app",
messagingSenderId:"1002919769364",
appId:"1:1002919769364:web:face9ebdbe3cb1db37fe01",
measurementId:"G-5FVEW59WH3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentCode = null;
let unsubscribeLeaderboard = null;
let latestSnapshot = null;

const teachers = [
"vanherzeelematteo@gmail.com"
];

function generateCode(){

const chars =
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let code = "";

for(let i=0;i<6;i++){

code += chars.charAt(
Math.floor(Math.random()*chars.length)
);

}

return code;

}

function formatTime(totalSeconds){

const minutes =
Math.floor(totalSeconds / 60);

const seconds =
String(totalSeconds % 60)
.padStart(2,"0");

return `${minutes}:${seconds}`;

}

onAuthStateChanged(auth,(user)=>{

if(!user) return;

if(teachers.includes(user.email)){

document.getElementById(
"teacherPanel"
).style.display = "block";

}

});

document
.getElementById("createGame")
.addEventListener("click",async()=>{

const year =
document.getElementById(
"yearSelect"
).value;

const exercise =
document.getElementById(
"exerciseSelect"
).value;

const code =
generateCode();

currentCode = code;

await setDoc(

doc(
db,
"multiplayerGames",
code
),

{
active:true,
year,
exercise,
createdAt:Date.now()
}

);

document.getElementById(
"generatedCode"
).innerHTML =
`<div class="code">${code}</div>`;

document.getElementById(
"leaderboardSection"
).style.display = "block";

startLeaderboard(code);

});

document
.getElementById("stopGame")
.addEventListener("click",async()=>{

if(!currentCode) return;

await updateDoc(

doc(
db,
"multiplayerGames",
currentCode
),

{
active:false
}

);

if(unsubscribeLeaderboard){

unsubscribeLeaderboard();

}

document.getElementById(
"leaderboardSection"
).style.display = "none";

document.getElementById(
"generatedCode"
).innerHTML = "";

document.getElementById(
"playersList"
).innerHTML = "";

currentCode = null;

alert("Sessie gestopt");

});

document
.getElementById("joinBtn")
.addEventListener("click",async()=>{

const user =
auth.currentUser;

if(!user){

alert("Log eerst in");
return;

}

const code =
document
.getElementById("joinCode")
.value
.trim()
.toUpperCase();

const gameSnap =
await getDoc(
doc(
db,
"multiplayerGames",
code
)
);

if(!gameSnap.exists()){

alert("Code bestaat niet");
return;

}

const game =
gameSnap.data();

if(!game.active){

alert("Sessie afgelopen");
return;

}

await setDoc(

doc(
db,
"multiplayerGames",
code,
"players",
user.uid
),

{
name:user.email,
score:0,
time:0,
startTime:Date.now(),
finished:false,
joinedAt:Date.now()
}

);

localStorage.setItem(
"multiplayerCode",
code
);

window.location.href =

"https://mvanherzeele.github.io/Franse-Nederlandse-woorden/" +
game.year +
"/oefeningen/" +
game.exercise +
".html";

});

function renderLeaderboard(){

if(!latestSnapshot) return;

const leaderboard =
document.getElementById(
"playersList"
);

let html = "";
let place = 1;

latestSnapshot.forEach((playerDoc)=>{

const player =
playerDoc.data();

let seconds;

if(player.finished){

seconds =
Math.floor(
(player.time || 0) / 1000
);

}else{

seconds =
Math.floor(
(
Date.now() -
(player.startTime || Date.now())
) / 1000
);

}

html += `

<div class="player">

<b>#${place}</b><br>

${player.name}<br>

Score: ${player.score || 0}<br>

Tijd: ${formatTime(seconds)}

</div>

`;

place++;

});

leaderboard.innerHTML = html;

}

function startLeaderboard(code){

const playersRef =
query(

collection(
db,
"multiplayerGames",
code,
"players"
),

orderBy("score","desc")

);

unsubscribeLeaderboard =
onSnapshot(

playersRef,

(snapshot)=>{

latestSnapshot = snapshot;

if(snapshot.empty){

document.getElementById(
"playersList"
).innerHTML =
"Nog geen spelers";

return;

}

renderLeaderboard();

},

(error)=>{

document.getElementById(
"playersList"
).innerHTML =
error.message;

}

);

}

setInterval(()=>{

renderLeaderboard();

},1000);

</script>

</body>
</html>

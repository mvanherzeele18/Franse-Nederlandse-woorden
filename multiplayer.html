<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multiplayer</title>

<style>

:root{
  --green:#6BBE3A;
  --green-dark:#2E7D32;
  --green-light:#D4E8B8;
  --yellow:#FDD835;
  --bg:#F1F8E9;
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  padding:2rem;
}

.box{
  max-width:800px;
  margin:auto;
  background:white;
  border:3px solid var(--green);
  border-radius:16px;
  padding:2rem;
}

button{
  background:var(--yellow);
  border:none;
  padding:12px 20px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px;
  border:2px solid var(--green);
  border-radius:10px;
  margin-bottom:1rem;
}

.player{
  background:var(--green-light);
  padding:10px;
  border-radius:8px;
  margin-bottom:8px;
}

.code{
  font-size:2rem;
  font-weight:bold;
  margin-top:1rem;
}

#teacherPanel{
  display:none;
}

</style>
</head>
<body>

<div class="box">

<h1>Multiplayer</h1>

<div id="teacherPanel">

<h2>Leerkracht</h2>

<label>Jaar</label>

<select id="yearSelect">

<option value="3dejaar">
3de jaar
</option>

<option value="4dejaar">
4de jaar
</option>

</select>

<br><br>

<label>Oefening</label>

<select id="exerciseSelect">

<option value="nl-fr-dossier1">
NL → FR Dossier 1
</option>

<option value="nl-fr-dossier2">
NL → FR Dossier 2
</option>

<option value="nl-fr-dossier3">
NL → FR Dossier 3
</option>

<option value="nl-fr-dossier4">
NL → FR Dossier 4
</option>

<option value="nl-fr-dossier5">
NL → FR Dossier 5
</option>

<option value="fr-nl-dossier1">
FR → NL Dossier 1
</option>

<option value="fr-nl-dossier2">
FR → NL Dossier 2
</option>

<option value="fr-nl-dossier3">
FR → NL Dossier 3
</option>

<option value="fr-nl-dossier4">
FR → NL Dossier 4
</option>

<option value="fr-nl-dossier5">
FR → NL Dossier 5
</option>

</select>

<br><br>

<button id="createGame">
Groep aanmaken
</button>

<button id="stopGame">
Sessie stoppen
</button>

<div id="generatedCode"></div>

<div
id="leaderboardSection"
style="display:none;margin-top:2rem;"
>

<h2>
Live Scorebord
</h2>

<div id="playersList">
Nog geen spelers
</div>

</div>

</div>

<h2>Leerling</h2>

<input
id="joinCode"
placeholder="Groepscode"
>

<button id="joinBtn">
Deelnemen
</button>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
updateDoc,
collection,
query,
orderBy,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyBS7uI4tD1XihrIbK2p1cNYGk4b1ipLg3o",
authDomain:"vocabulairesite.firebaseapp.com",
projectId:"vocabulairesite",
storageBucket:"vocabulairesite.firebasestorage.app",
messagingSenderId:"1002919769364",
appId:"1:1002919769364:web:face9ebdbe3cb1db37fe01",
measurementId:"G-5FVEW59WH3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentCode = null;
let unsubscribeLeaderboard = null;

const teachers = [
"vanherzeelematteo@gmail.com"
];

function generateCode(){

const chars =
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let code = "";

for(let i=0;i<6;i++){

code += chars.charAt(
Math.floor(Math.random()*chars.length)
);

}

return code;

}

onAuthStateChanged(auth,(user)=>{

if(!user) return;

if(teachers.includes(user.email)){

document.getElementById(
"teacherPanel"
).style.display = "block";

}

});

document
.getElementById("createGame")
.addEventListener("click",async()=>{

const year =
document.getElementById(
"yearSelect"
).value;

const exercise =
document.getElementById(
"exerciseSelect"
).value;

const code =
generateCode();

currentCode = code;

await setDoc(

doc(
db,
"multiplayerGames",
code
),

{
active:true,
year:year,
exercise:exercise,
createdAt:Date.now()
}

);

document.getElementById(
"generatedCode"
).innerHTML =

`<div class="code">${code}</div>`;

document.getElementById(
"leaderboardSection"
).style.display = "block";

startLeaderboard(code);

});

document
.getElementById("stopGame")
.addEventListener("click",async()=>{

if(!currentCode) return;

await updateDoc(

doc(
db,
"multiplayerGames",
currentCode
),

{
active:false
}

);

if(unsubscribeLeaderboard){

unsubscribeLeaderboard();

}

document.getElementById(
"leaderboardSection"
).style.display = "none";

document.getElementById(
"generatedCode"
).innerHTML = "";

document.getElementById(
"playersList"
).innerHTML = "";

currentCode = null;

alert("Sessie gestopt");

});

document
.getElementById("joinBtn")
.addEventListener("click",async()=>{

const user =
auth.currentUser;

if(!user){

alert("Log eerst in");
return;

}

const code =
document.getElementById(
"joinCode"
).value
.trim()
.toUpperCase();

const gameRef =
doc(
db,
"multiplayerGames",
code
);

const gameSnap =
await getDoc(gameRef);

if(!gameSnap.exists()){

alert("Code bestaat niet");
return;

}

const game =
gameSnap.data();

if(!game.active){

alert("Sessie afgelopen");
return;

}

await setDoc(

doc(
db,
"multiplayerGames",
code,
"players",
user.uid
),

{
name:user.email,
score:0,
time:999999999,
joinedAt:Date.now()
}

);

localStorage.setItem(
"multiplayerCode",
code
);

let url =
"https://mvanherzeele.github.io/Franse-Nederlandse-woorden/" +
game.year +
"/oefeningen/" +
game.exercise +
".html";

window.location.href =
url;

});

function startLeaderboard(code){

const playersRef =
query(
collection(
db,
"multiplayerGames",
code,
"players"
),
orderBy("score","desc")
);

unsubscribeLeaderboard =
onSnapshot(

playersRef,

(snapshot)=>{

console.log(
"Aantal spelers:",
snapshot.size
);

const leaderboard =
document.getElementById(
"playersList"
);

if(snapshot.empty){

leaderboard.innerHTML =
"Nog geen spelers";

return;

}

let html = "";

let place = 1;

snapshot.forEach((playerDoc)=>{

const player =
playerDoc.data();

html += `
<div class="player">

<b>#${place}</b><br>

${player.name}<br>

Score: ${player.score}<br>

Tijd: ${player.time}

</div>
`;

place++;

});

leaderboard.innerHTML =
html;

},

(error)=>{

console.error(error);

document.getElementById(
"playersList"
).innerHTML =

error.message;

}

);

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multiplayer</title>

<style>

:root{
  --green:#6BBE3A;
  --green-dark:#2E7D32;
  --green-light:#D4E8B8;
  --yellow:#FDD835;
  --bg:#F1F8E9;
}

body{
  font-family:Arial,sans-serif;
  background:var(--bg);
  padding:2rem;
}

.box{
  max-width:800px;
  margin:auto;
  background:white;
  border:3px solid var(--green);
  border-radius:16px;
  padding:2rem;
}

button{
  background:var(--yellow);
  border:none;
  padding:12px 20px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

input{
  width:100%;
  padding:12px;
  border:2px solid var(--green);
  border-radius:10px;
  margin-bottom:1rem;
}

.player{
  background:var(--green-light);
  padding:10px;
  border-radius:8px;
  margin-bottom:8px;
}

.code{
  font-size:2rem;
  font-weight:bold;
  margin-top:1rem;
}

#teacherPanel{
  display:none;
}

</style>
</head>
<body>

<div class="box">

<h1>Multiplayer</h1>

<div id="teacherPanel">

<h2>Leerkracht</h2>

<button id="createGame">
Groep aanmaken
</button>

<button id="stopGame">
Sessie stoppen
</button>

<div id="generatedCode"></div>

</div>

<h2>Leerling</h2>

<input
id="joinCode"
placeholder="Groepscode"
>

<button id="joinBtn">
Deelnemen
</button>

<h2>Scorebord</h2>

<div id="playersList">
Nog geen spelers
</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
updateDoc,
collection,
onSnapshot,
query,
orderBy
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {

apiKey: "JOUW_APIKEY",
authDomain: "vocabulairesite.firebaseapp.com",
projectId: "vocabulairesite",
storageBucket: "vocabulairesite.firebasestorage.app",
messagingSenderId: "1002919769364",
appId: "JOUW_APPID"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

let currentCode = null;

const teachers = [

"vanherzeelematteo@gmail.com"

];

function generateCode(){

const chars =
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let code = "";

for(let i=0;i<6;i++){

code += chars.charAt(
Math.floor(
Math.random()*chars.length
)
);

}

return code;

}

onAuthStateChanged(auth,user=>{

if(!user) return;

if(
teachers.includes(user.email)
){

document.getElementById(
"teacherPanel"
).style.display="block";

}

});

document
.getElementById("createGame")
.addEventListener(
"click",
async()=>{

const code =
generateCode();

currentCode = code;

await setDoc(

doc(
db,
"multiplayerGames",
code
),

{
active:true,
createdAt:Date.now()
}

);

document
.getElementById(
"generatedCode"
).innerHTML =

`<div class="code">${code}</div>`;

listenPlayers(code);

}
);

document
.getElementById("stopGame")
.addEventListener(
"click",
async()=>{

if(!currentCode) return;

await updateDoc(

doc(
db,
"multiplayerGames",
currentCode
),

{
active:false
}

);

alert(
"Sessie gestopt"
);

}
);

document
.getElementById("joinBtn")
.addEventListener(
"click",
async()=>{

const user =
auth.currentUser;

const code =
document
.getElementById(
"joinCode"
)
.value
.trim()
.toUpperCase();

const gameSnap =
await getDoc(
doc(
db,
"multiplayerGames",
code
)
);

if(
!gameSnap.exists()
){

alert("Code bestaat niet");
return;

}

if(
!gameSnap.data().active
){

alert("Sessie afgelopen");
return;

}

await setDoc(

doc(
db,
"multiplayerGames",
code,
"players",
user.uid
),

{
name:
user.email,

score:0,

time:0,

joinedAt:
Date.now()

}

);

localStorage.setItem(
"multiplayerCode",
code
);

window.location.href =
"nl-fr-dossier1.html";

}
);

function listenPlayers(code){

const playersRef =
query(
collection(
db,
"multiplayerGames",
code,
"players"
),
orderBy("score","desc"),
orderBy("time","asc")
);

onSnapshot(
playersRef,
(snapshot)=>{

let html="";

let place=1;

snapshot.forEach(doc=>{

const p =
doc.data();

html += `

<div class="player">
#${place}
${p.name}
-
${p.score} punten
</div>

`;

place++;

});

document
.getElementById(
"playersList"
).innerHTML =

html ||
"Nog geen spelers";

}
);

}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplayer</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--green:#6BBE3A;--green-light:#D4E8B8;--green-dark:#2E7D32;--yellow:#FDD835;--bg:#F1F8E9;--white:#fff;--text:#1B5E20;--muted:#558B2F}
*{box-sizing:border-box;margin:0;padding:0} body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:linear-gradient(135deg,var(--green-dark),var(--green));padding:2rem;border-bottom:4px solid var(--yellow);display:flex;justify-content:space-between;align-items:center;gap:1rem} header h1{font-family:'Playfair Display',serif;color:var(--yellow)}
.nav-btn,button{background:var(--yellow);color:var(--green-dark);border:0;border-radius:10px;padding:.75rem 1.2rem;font:600 1rem 'DM Sans',sans-serif;cursor:pointer;text-decoration:none}.nav-btn:hover,button:hover{background:var(--green-light)}
main{max-width:900px;margin:2rem auto;padding:0 1rem}.box{background:var(--white);border:3px solid var(--green);border-radius:16px;padding:2rem;box-shadow:0 6px 20px #00000014}h2{color:var(--green-dark);margin-bottom:1rem}label{display:block;font-weight:600;margin:1rem 0 .4rem}select,input{width:100%;padding:.8rem;border:2px solid var(--green);border-radius:10px;font:1rem 'DM Sans',sans-serif;background:#fff}.actions{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.5rem}.secondary{background:var(--green-light)}.code{margin:1rem 0;padding:1rem;background:var(--green-light);border-radius:12px;text-align:center;font-size:2rem;font-weight:bold;letter-spacing:.15em;color:var(--green-dark)}.hint{color:var(--muted);margin:.5rem 0 1rem}.hidden{display:none!important}.players{margin-top:1.5rem}.player{background:var(--green-light);padding:.8rem 1rem;border-radius:10px;margin:.5rem 0;border-left:5px solid var(--green)}.status{padding:1rem;border-radius:10px;background:#f8fbeF;margin-top:1rem}.error{color:#b3261e;margin-top:1rem;font-weight:600}@media(max-width:600px){header{flex-direction:column;text-align:center}.nav-btn{width:100%;text-align:center}.box{padding:1.3rem}.actions button{width:100%}}
</style>
</head>
<body style="display:none">
<header><h1>Multiplayer</h1><a class="nav-btn" href="index.html">← Terug</a></header>
<main>
<section class="box" id="setupPanel">
<h2>Nieuwe sessie aanmaken</h2>
<p class="hint">Kies eerst het jaar, daarna de richting en één dossier.</p>
<label for="yearSelect">Jaar</label>
<select id="yearSelect"><option value="3dejaar">3de jaar</option><option value="4dejaar">4de jaar</option></select>
<label for="directionSelect">Richting</label>
<select id="directionSelect"><option value="nl-fr">Nederlands → Frans</option><option value="fr-nl">Frans → Nederlands</option></select>
<label for="dossierSelect">Dossier</label>
<select id="dossierSelect"></select>
<div class="actions"><button id="createGame">Sessie aanmaken</button></div>
</section>
<section class="box" id="joinPanel" style="margin-top:1.5rem">
<h2>Deelnemen aan een sessie</h2>
<p class="hint">Geef de code van de sessie in. Je gaat pas naar de quiz wanneer de maker start.</p>
<input id="joinCode" maxlength="6" placeholder="Bijvoorbeeld K7M4PX" autocomplete="off">
<div class="actions"><button id="joinBtn">Deelnemen</button></div>
</section>
<section class="box hidden" id="lobbyPanel" style="margin-top:1.5rem">
<h2 id="lobbyTitle">Wachtkamer</h2>
<p id="lobbySettings" class="hint"></p>
<div class="code" id="generatedCode"></div>
<p class="status" id="lobbyStatus">Wachten tot de maker de quiz start…</p>
<div class="players"><h2>Spelers</h2><div id="playersList">Nog geen spelers</div></div>
<div class="actions"><button id="startGame" class="hidden">Quiz starten</button><button id="leaveGame" class="secondary">Sessie verlaten</button></div>
</section>
<p class="error" id="errorMessage"></p>
</main>
<script type="module" src="https://mvanherzeele18.github.io/Franse-Nederlandse-woorden/auth-check.js"></script>
<script type="module">
import {initializeApp,getApps,getApp} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js';
import {getFirestore,doc,setDoc,getDoc,updateDoc,onSnapshot,collection,query,orderBy} from 'https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js';
const config={apiKey:'AIzaSyBS7uI4tD1XihrIbK2p1cNYGk4b1ipLg3o',authDomain:'vocabulairesite.firebaseapp.com',projectId:'vocabulairesite',storageBucket:'vocabulairesite.firebasestorage.app',messagingSenderId:'1002919769364',appId:'1:1002919769364:web:face9ebdbe3cb1db37fe01'};
const app=getApps().length?getApp():initializeApp(config),auth=getAuth(app),db=getFirestore(app);
// Pas dit aantal dossiers aan wanneer er nieuwe dossiers beschikbaar zijn.
const availableDossiers={'3dejaar':10,'4dejaar':1};
let currentCode=null,currentGameUnsubscribe=null,currentPlayersUnsubscribe=null,currentUser=null,isHost=false;
const $=id=>document.getElementById(id);
function showError(message){$('errorMessage').textContent=message}
function fillDossiers(){const count=availableDossiers[$('yearSelect').value]||0;$('dossierSelect').innerHTML=Array.from({length:count},(_,i)=>`<option value="${i+1}">Dossier ${i+1}</option>`).join('')}
function code(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from({length:6},()=>chars[Math.floor(Math.random()*chars.length)]).join('')}
function quizUrl(game){return `${location.origin}/Franse-Nederlandse-woorden/${game.year}/oefeningen/${game.direction}-dossier${game.dossier}.html`}
function renderPlayers(snapshot){if(snapshot.empty){$('playersList').textContent='Nog geen spelers';return}let html='';let n=1;snapshot.forEach(p=>{const data=p.data();html+=`<div class="player"><b>#${n++}</b> ${data.name||'Speler'}</div>`});$('playersList').innerHTML=html}
function showLobby(game){$('setupPanel').classList.add('hidden');$('joinPanel').classList.add('hidden');$('lobbyPanel').classList.remove('hidden');$('generatedCode').textContent=currentCode;$('lobbySettings').textContent=`${game.year==='3dejaar'?'3de jaar':'4de jaar'} · ${game.direction==='nl-fr'?'Nederlands → Frans':'Frans → Nederlands'} · Dossier ${game.dossier}`;$('startGame').classList.toggle('hidden',!isHost);}
function watchGame(){currentGameUnsubscribe=onSnapshot(doc(db,'multiplayerGames',currentCode),snap=>{if(!snap.exists()){showError('Deze sessie bestaat niet meer.');return}const game=snap.data();if(!game.active){$('lobbyStatus').textContent='Deze sessie is gestopt.';return}if(game.status==='playing'){window.location.href=quizUrl(game);return}showLobby(game)});currentPlayersUnsubscribe=onSnapshot(query(collection(db,'multiplayerGames',currentCode,'players'),orderBy('joinedAt','asc')),renderPlayers)}
async function createGame(){showError('');if(!currentUser)return;const gameCode=code();const game={active:true,status:'waiting',hostId:currentUser.uid,year:$('yearSelect').value,direction:$('directionSelect').value,dossier:Number($('dossierSelect').value),createdAt:Date.now()};try{await setDoc(doc(db,'multiplayerGames',gameCode),game);await setDoc(doc(db,'multiplayerGames',gameCode,'players',currentUser.uid),{name:currentUser.displayName||currentUser.email?.split('@')[0]||'Maker',score:0,finished:false,joinedAt:Date.now(),host:true});currentCode=gameCode;isHost=true;showLobby(game);watchGame()}catch(e){showError('De sessie kon niet worden aangemaakt. Probeer opnieuw.')}}
async function joinGame(){showError('');if(!currentUser)return;const gameCode=$('joinCode').value.trim().toUpperCase();if(!/^[A-Z0-9]{6}$/.test(gameCode)){showError('Geef een geldige code van 6 tekens in.');return}try{const ref=doc(db,'multiplayerGames',gameCode),snap=await getDoc(ref);if(!snap.exists()){showError('Code bestaat niet.');return}const game=snap.data();if(!game.active){showError('Deze sessie is afgelopen.');return}await setDoc(doc(db,'multiplayerGames',gameCode,'players',currentUser.uid),{name:currentUser.displayName||currentUser.email?.split('@')[0]||'Speler',score:0,finished:false,joinedAt:Date.now(),host:false},{merge:true});currentCode=gameCode;isHost=false;showLobby(game);watchGame()}catch(e){showError('Deelnemen is mislukt. Probeer opnieuw.')}}
$('yearSelect').addEventListener('change',fillDossiers);$('createGame').addEventListener('click',createGame);$('joinBtn').addEventListener('click',joinGame);$('joinCode').addEventListener('keydown',e=>{if(e.key==='Enter')joinGame()});$('startGame').addEventListener('click',async()=>{if(!isHost||!currentCode)return;await updateDoc(doc(db,'multiplayerGames',currentCode),{status:'playing'})});$('leaveGame').addEventListener('click',()=>{if(currentGameUnsubscribe)currentGameUnsubscribe();if(currentPlayersUnsubscribe)currentPlayersUnsubscribe();location.reload()});
fillDossiers();onAuthStateChanged(auth,user=>{if(user){currentUser=user;document.body.style.display='block'}else{window.location.href='login.html'}});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Multiplayer</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#F1F8E9;
  padding:2rem;
}

.box{
  max-width:600px;
  margin:auto;
  background:white;
  padding:2rem;
  border-radius:16px;
  border:3px solid #6BBE3A;
}

button{
  background:#FDD835;
  border:none;
  padding:12px 20px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  opacity:.9;
}

#teacherPanel{
  display:none;
}

.code{
  margin-top:1rem;
  padding:1rem;
  background:#D4E8B8;
  border-radius:10px;
  font-size:2rem;
  text-align:center;
  font-weight:bold;
}
</style>

</head>
<body>

<div class="box">

<h1>Multiplayer</h1>

<div id="teacherPanel">

<h2>Leerkracht</h2>

<button id="createGame">
Groep aanmaken
</button>

<div id="generatedCode"></div>

</div>

<div id="studentPanel">

<h2>Leerling</h2>

<input
id="joinCode"
placeholder="Groepscode"
style="padding:10px;width:100%;margin-bottom:1rem;"
>

<button id="joinBtn">
Deelnemen
</button>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyBS7uI4tD1XihrIbK2p1cNYGk4b1ipLg3o",

authDomain: "vocabulairesite.firebaseapp.com",

projectId: "vocabulairesite",

storageBucket: "vocabulairesite.firebasestorage.app",

messagingSenderId: "1002919769364",

appId: "1:1002919769364:web:face9ebdbe3cb1db37fe01"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const teachers = [

"vanherzeelematteo@gmail.com"

];

function generateCode(){

const chars =
"ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

let code = "";

for(let i=0;i<6;i++){

code += chars.charAt(
Math.floor(Math.random()*chars.length)
);

}

return code;

}

onAuthStateChanged(auth, user => {

if(!user){

window.location.href =
"/Franse-Nederlandse-woorden/login.html";

return;

}

if(
teachers.includes(user.email)
){

document.getElementById(
"teacherPanel"
).style.display = "block";

}

});

document
.getElementById("createGame")
.addEventListener("click", async ()=>{

const code = generateCode();

await setDoc(

doc(
db,
"multiplayerGames",
code
),

{
active:true,
createdAt:Date.now(),
createdBy:"vanherzeelematteo@gmail.com"
}

);

document.getElementById(
"generatedCode"
).innerHTML =

`<div class="code">${code}</div>`;

});

document
.getElementById("joinBtn")
.addEventListener("click", async ()=>{

const code =
document.getElementById(
"joinCode"
).value.trim().toUpperCase();

const gameRef =
doc(
db,
"multiplayerGames",
code
);

const gameSnap =
await getDoc(gameRef);

if(!gameSnap.exists()){

alert("Code bestaat niet");

return;

}

const game =
gameSnap.data();

if(!game.active){

alert("Deze sessie is afgelopen");

return;

}

alert("Succesvol verbonden!");

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="nl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #F1F8E9;
      font-family: 'DM Sans', sans-serif;
    }

    .login-box {
      background: white;
      padding: 3rem;
      border-radius: 16px;
      border: 3px solid #6BBE3A;
      width: 360px;
      box-shadow: 0 8px 24px rgba(107,190,58,0.2);
      text-align: center;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      color: #2E7D32;
      margin-bottom: 2rem;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 1rem;
      border-radius: 8px;
      border: 2px solid #C5E1A5;
      font-size: 1rem;
      box-sizing: border-box;
    }

    input:focus {
      outline: none;
      border-color: #6BBE3A;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #6BBE3A;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(107,190,58,0.25);
      background: #81C784;
    }

    .forgot-password-link {
      display: inline-block;
      margin-top: 0.8rem;
      color: #558B2F;
      font-size: 0.85rem;
      text-decoration: none;
      transition: 0.3s;
    }

    .forgot-password-link:hover {
      color: #2E7D32;
      text-decoration: underline;
    }

    .register-link {
      margin-top: 1.2rem;
      display: block;
      color: #2E7D32;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
    }

    .register-link:hover {
      color: #6BBE3A;
    }

    .info {
      color: #558B2F;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      line-height: 1.5;
    }

  </style>

</head>

<body>

  <div class="login-box">

    <h1>Inloggen</h1>

    <p class="info">
      Log in bij je account om toegang te krijgen tot de oefeningen en vocabulaire.
    </p>
    
    <input
      type="email"
      id="email"
      placeholder="E-mailadres"
    >

    <input
      type="password"
      id="password"
      placeholder="Wachtwoord"
    >

    <button onclick="login()">
      Inloggen
    </button>

    <a class="register-link"
       href="/Franse-Nederlandse-woorden/register.html">
      Nog geen account? Registreren
    </a>

    <a href="#" class="register-link" onclick="resetPassword(event)">
      Wachtwoord vergeten?
    </a>

  </div>

  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      signOut
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc
    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey:
      "AIzaSyBS7uI4tD1XihrIbK2p1cNYGk4b1ipLg3o",

      authDomain:
      "vocabulairesite.firebaseapp.com",

      projectId:
      "vocabulairesite",

      storageBucket:
      "vocabulairesite.firebasestorage.app",

      messagingSenderId:
      "1002919769364",

      appId:
      "1:1002919769364:web:face9ebdbe3cb1db37fe01",

      measurementId:
      "G-5FVEW59WH3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.login = async function () {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      try {
        const userCredential = await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

        if (!userCredential.user.emailVerified) {
          await signOut(auth);
          alert("Controleer eerst je e-mail en verifieer je account.");
          return;
        }

        const user = userCredential.user;
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
          await setDoc(userRef, {
            email: user.email || email,
            xp: 0
          });
        }

        const params = new URLSearchParams(window.location.search);
        const redirect = params.get("redirect");

        if (redirect) {
          window.location.href = redirect;
        } else {
          window.location.href = "/Franse-Nederlandse-woorden/index.html";
        }

      } catch (error) {
        alert("Fout e-mailadres of wachtwoord.");
        console.log(error);
      }
    };

    /* ================================================
       WACHTWOORD HERSTEL FUNCTIE
    ================================================ */
    window.resetPassword = async function (e) {
      if (e) e.preventDefault();

      let email = document.getElementById("email").value.trim();

      // Als het e-mailveld leeg is, vraag er direct om via een prompt
      if (!email) {
        email = prompt("Vul je e-mailadres in om een herstelmail te ontvangen:");
      }

      if (!email) return;

      try {
        await sendPasswordResetEmail(auth, email);
        alert("Er is een e-mail verstuurd om je wachtwoord te herstellen. Controleer ook je spambox.");
      } catch (error) {
        if (error.code === "auth/invalid-email") {
          alert("Ongeldig e-mailadres ingevuld.");
        } else if (error.code === "auth/user-not-found") {
          alert("Er is geen account gevonden met dit e-mailadres.");
        } else {
          alert("Er is iets misgegaan bij het versturen van de herstelmail.");
        }
        console.error(error);
      }
    };

  </script>

</body>
</html>

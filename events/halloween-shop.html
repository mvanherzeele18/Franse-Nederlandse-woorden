<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Halloween Shop 🎃</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --green: #6BBE3A;
  --green-light: #D4E8B8;
  --green-dark: #2E7D32;
  --yellow: #FDD835;
  --bg: #F1F8E9;
  --white: #FFFFFF;
  --text: #1B5E20;
}

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: var(--text);
}

/* ───────────────────────────────
   PERFECTE HEADER (identiek)
─────────────────────────────── */
header {
  background: linear-gradient(
    135deg,
    var(--green-dark) 0%,
    var(--green) 100%
  );

  padding: 2rem;
  border-bottom: 4px solid var(--yellow);

  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
}

header h1 {
  font-family: 'Playfair Display', serif;
  color: var(--yellow);
  font-size: 2rem;
}

.nav-btn {
  background: var(--yellow);
  color: var(--green-dark);
  text-decoration: none;
  padding: 0.7rem 1.2rem;
  border-radius: 10px;
  font-weight: 600;
  transition: all 0.3s;
}

.nav-btn:hover {
  background: var(--green-light);
  transform: translateY(-2px);
}

@media (max-width: 600px) {
  header {
    flex-direction: column;
    text-align: center;
  }

  .nav-btn {
    width: 100%;
    text-align: center;
  }
}

/* ───────────────────────────────
   MAIN
─────────────────────────────── */
main {
  max-width: 900px;
  margin: 2rem auto;
  padding: 0 1rem;
}

/* Snoepjes kaart */
.currency-card {
  background: var(--white);
  border: 3px solid var(--green);
  border-radius: 16px;
  padding: 1.5rem;
  margin-bottom: 2rem;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}

.currency-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem;
  margin-bottom: 0.5rem;
  color: var(--green-dark);
}

.currency-amount {
  font-size: 1.8rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

/* Shop grid */
.shop-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.5rem;
}

/* Shop item */
.shop-item {
  background: var(--white);
  border: 3px solid var(--green);
  border-radius: 16px;
  padding: 1.5rem;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  transition: 0.3s;
}

.shop-item:hover {
  border-color: var(--yellow);
  transform: translateY(-2px);
}

.shop-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  margin-bottom: 0.5rem;
  color: var(--green-dark);
}

.shop-meta {
  margin-bottom: 1rem;
  color: var(--text);
}

/* Koopknop */
.btn-buy {
  background: var(--yellow);
  color: var(--green-dark);
  padding: 0.7rem 1.2rem;
  border-radius: 10px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: 0.3s;
}

.btn-buy:hover {
  background: var(--green-light);
  transform: translateY(-2px);
}

/* Status */
.status {
  margin-top: 1rem;
  font-size: 0.9rem;
  opacity: 0.8;
}
</style>
</head>

<body>

<header>
  <h1>Halloween Shop</h1>

  <a 
    href="../index.html"
    class="nav-btn"
  >
    ← Terug
  </a>
</header>

<main>

  <div class="currency-card">
    <div class="currency-title">Jouw snoepjes</div>
    <div class="currency-amount">
      🍬 <span id="candyAmount">–</span>
    </div>
  </div>

  <div class="shop-grid" id="shopGrid"></div>

  <div class="status" id="statusMessage">Shop wordt geladen…</div>

</main>

<script type="module">
import { halloweenConfig } from "./halloween2026.js";

/* Firebase */
async function firebaseBase() {
  const { initializeApp, getApps, getApp } =
    await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js");

  const firebaseConfig = {
    apiKey:"AIzaSyBS7uI4tD1XihrIbK2p1cNYGk4b1ipLg3o",
    authDomain:"vocabulairesite.firebaseapp.com",
    projectId:"vocabulairesite",
    storageBucket:"vocabulairesite.firebasestorage.app",
    messagingSenderId:"1002919769364",
    appId:"1:1002919769364:web:face9ebdbe3cb1db37fe01",
    measurementId:"G-5FVEW59WH3"
  };

  const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
  return app;
}

/* Auth correct detecteren */
async function waitForUser() {
  const app = await firebaseBase();
  const { getAuth, onAuthStateChanged } =
    await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js");

  const auth = getAuth(app);

  return new Promise(resolve => {
    onAuthStateChanged(auth, user => resolve(user));
  });
}

/* Load candy */
async function loadCandy(user) {
  const app = await firebaseBase();
  const { getFirestore, doc, getDoc } =
    await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js");

  const db = getFirestore(app);

  const ref = doc(db, "users", user.uid, "eventCurrencies", halloweenConfig.id);
  const snap = await getDoc(ref);

  const amount = snap.exists()
    ? (snap.data()[halloweenConfig.currencyName] || 0)
    : 0;

  document.getElementById("candyAmount").textContent = amount;
  document.getElementById("statusMessage").textContent = "Shop klaar.";

  return amount;
}

/* Render shop */
function renderShop() {
  const grid = document.getElementById("shopGrid");
  grid.innerHTML = "";

  for (const key of Object.keys(halloweenConfig.shop)) {
    const item = halloweenConfig.shop[key];

    const div = document.createElement("div");
    div.className = "shop-item";

    div.innerHTML = `
      <div class="shop-title">${item.label}</div>
      <div class="shop-meta">🍬 Kost: ${item.cost}</div>
      <button class="btn-buy" data-id="${key}">Kopen</button>
    `;

    grid.appendChild(div);
  }
}

/* Handle purchase */
async function handlePurchase(id, user) {
  const item = halloweenConfig.shop[id];

  const app = await firebaseBase();
  const { getFirestore, doc, getDoc, setDoc } =
    await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js");

  const db = getFirestore(app);

  const currencyRef = doc(db, "users", user.uid, "eventCurrencies", halloweenConfig.id);
  const currencySnap = await getDoc(currencyRef);

  let current = currencySnap.exists()
    ? (currencySnap.data()[halloweenConfig.currencyName] || 0)
    : 0;

  if (current < item.cost) {
    document.getElementById("statusMessage").textContent = "Onvoldoende snoepjes.";
    return;
  }

  current -= item.cost;

  await setDoc(currencyRef, { [halloweenConfig.currencyName]: current }, { merge: true });

  if (item.type === "xp") {
    const userRef = doc(db, "users", user.uid);
    const userSnap = await getDoc(userRef);
    let xp = userSnap.exists() ? (userSnap.data().xp || 0) : 0;
    xp += item.amount;
    await setDoc(userRef, { xp }, { merge: true });
  }

  if (item.type === "title") {
    const achRef = doc(db, "achievements", user.uid);
    await setDoc(achRef, {
      [item.titleName]: { date: Date.now(), source: "halloween2026" }
    }, { merge: true });
  }

  document.getElementById("candyAmount").textContent = current;
  document.getElementById("statusMessage").textContent = "Aankoop gelukt!";
}

/* Init */
renderShop();

waitForUser().then(user => {
  if (!user) {
    document.getElementById("statusMessage").textContent = "Je bent niet ingelogd.";
    return;
  }

  loadCandy(user);

  document.addEventListener("click", (e) => {
    if (e.target.classList.contains("btn-buy")) {
      handlePurchase(e.target.dataset.id, user);
    }
  });
});
</script>

</body>
</html>

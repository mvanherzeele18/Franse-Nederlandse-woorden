<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Halloween Shop 🎃</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://mvanherzeele18.github.io/Franse-Nederlandse-woorden/events/halloween-theme.css">

<style>
:root {
  --green: #6BBE3A;
  --green-light: #D4E8B8;
  --green-dark: #2E7D32;
  --yellow: #FDD835;
  --bg: #F1F8E9;
  --white: #FFFFFF;
  --text: #1B5E20;
}

/* Algemene stijl */
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: var(--text);
}

/* Header */
header {
  background: linear-gradient(135deg, var(--green-dark) 0%, var(--green) 100%);
  padding: 2rem;
  border-bottom: 4px solid var(--yellow);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
}

header h1 {
  font-family: 'Playfair Display', serif;
  color: var(--yellow);
  font-size: 2rem;
}

.nav-btn {
  background: var(--yellow);
  color: var(--green-dark);
  text-decoration: none;
  padding: 0.7rem 1.2rem;
  border-radius: 10px;
  font-weight: 600;
  transition: 0.3s;
}

.nav-btn:hover {
  background: var(--green-light);
  transform: translateY(-2px);
}

/* Main */
main {
  max-width: 900px;
  margin: 2rem auto;
  padding: 0 1rem;
}

/* Currency card */
.currency-card {
  background: var(--white);
  border: 3px solid var(--green);
  border-radius: 16px;
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}

.currency-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem;
  margin-bottom: 0.5rem;
  color: var(--green-dark);
}

.currency-amount {
  font-size: 1.8rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

/* Shop grid */
.shop-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.5rem;
}

/* Shop item */
.shop-item {
  background: var(--white);
  border: 3px solid var(--green);
  border-radius: 16px;
  padding: 1.5rem;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  transition: 0.3s;
}

.shop-item:hover {
  border-color: var(--yellow);
  transform: translateY(-2px);
}

.shop-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.3rem;
  margin-bottom: 0.5rem;
  color: var(--green-dark);
}

.shop-meta {
  margin-bottom: 1rem;
  color: var(--text);
}

.btn-buy {
  background: var(--yellow);
  color: var(--green-dark);
  padding: 0.7rem 1.2rem;
  border-radius: 10px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: 0.3s;
}

.btn-buy:hover {
  background: var(--green-light);
  transform: translateY(-2px);
}

/* Status */
.status {
  margin-top: 1rem;
  font-size: 0.9rem;
  opacity: 0.8;
}
</style>
</head>

<body>

<header>
  <h1>🎃 Halloween Shop</h1>
  <a href="../index.html" class="nav-btn">← Terug</a>
</header>

<main>

  <div class="currency-card">
    <div class="currency-title">Jouw snoepjes</div>
    <div class="currency-amount">
      🍬 <span id="candyAmount">–</span>
    </div>
  </div>

  <div class="shop-grid" id="shopGrid">
    <!-- Wordt via JS gevuld -->
  </div>

  <div class="status" id="statusMessage">Shop wordt geladen…</div>

</main>

async function getUserAndDb() {
  const app = await firebaseBase();
  const { getFirestore } =
    await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js");
  const { getAuth } =
    await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js");

  return {
    db: getFirestore(app),
    user: getAuth(app).currentUser
  };
}

/* Load candy */
async function loadCandy() {
  const { db, user } = await getUserAndDb();
  const statusEl = document.getElementById("statusMessage");

  if (!user) {
    statusEl.textContent = "Je bent niet ingelogd.";
    return 0;
  }

  const { doc, getDoc } =
    await import("https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js");

  const ref = doc(db, "users", user.uid, "eventCurrencies", halloweenConfig.id);
  const snap = await getDoc(ref);

  const amount = snap.exists() ? (snap.data()[halloweenConfig.currencyName] || 0) : 0;

  document.getElementById("candyAmount").textContent = amount;
  statusEl.textContent = "Shop klaar.";

  return amount;
}

/* Render shop */
function renderShop() {
  const grid = document.getElementById("shopGrid");
  grid.innerHTML = "";

  for (const key of Object.keys(halloweenConfig.shop)) {
    const item = halloweenConfig.shop[key];

    const div = document.createElement("div");
    div.className = "shop-item";

    div.innerHTML = `
      <div class="shop-title">${item.label}</div>
      <div class="shop-meta">🍬 Kost: ${item.cost}</div>
      <button class="btn-buy" data-id="${key}">Kopen</button>
    `;

    grid.appendChild(div);
  }
}

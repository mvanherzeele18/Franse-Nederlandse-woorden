<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Halloween Shop 🎃</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #0b0b10;
      --card-bg: #151521;
      --accent: #ff6f00;
      --accent-soft: #ffb74d;
      --text: #f5f5f5;
      --muted: #9e9e9e;
      --danger: #e53935;
      --success: #43a047;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #1f1f2e 0, #050509 60%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      justify-content: center;
    }

    .page {
      max-width: 900px;
      width: 100%;
      padding: 24px 16px 40px;
      box-sizing: border-box;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .header-icon {
      font-size: 40px;
    }

    .header-text h1 {
      margin: 0;
      font-size: 26px;
      letter-spacing: 0.03em;
    }

    .header-text p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .currency-card {
      background: linear-gradient(135deg, #1b1b29, #12121b);
      border-radius: 16px;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.06);
    }

    .currency-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .currency-label {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    .currency-value {
      font-size: 22px;
      font-weight: 600;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .currency-value span.icon {
      font-size: 22px;
    }

    .currency-value span.amount {
      font-variant-numeric: tabular-nums;
    }

    .currency-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
    }

    .shop-item {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px 14px 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
    }

    .shop-item::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top left, rgba(255,111,0,0.18), transparent 55%);
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
    }

    .shop-item:hover::before {
      opacity: 1;
    }

    .shop-title {
      font-size: 16px;
      font-weight: 600;
    }

    .shop-type {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
    }

    .shop-meta {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: 13px;
      color: var(--muted);
    }

    .shop-cost {
      color: var(--accent-soft);
      font-weight: 500;
    }

    .shop-action {
      margin-top: 8px;
      display: flex;
      justify-content: flex-end;
    }

    .btn {
      border: none;
      outline: none;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s, box-shadow 0.12s, background 0.12s, color 0.12s;
    }

    .btn-primary {
      background: var(--accent);
      color: #1b1b1b;
      box-shadow: 0 4px 12px rgba(255,111,0,0.5);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(255,111,0,0.6);
    }

    .btn-primary:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(255,111,0,0.4);
    }

    .btn-disabled {
      background: #424242;
      color: #bdbdbd;
      cursor: not-allowed;
      box-shadow: none;
    }

    .status-bar {
      margin-top: 18px;
      font-size: 13px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status-message {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-message span.icon {
      font-size: 16px;
    }

    .status-message span.text {
      font-size: 13px;
    }

    .status-ok {
      color: var(--success);
    }

    .status-error {
      color: var(--danger);
    }

    .status-loading {
      color: var(--accent-soft);
    }

    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        align-items: flex-start;
      }

      .currency-card {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .shop-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="header">
      <div class="header-icon">🎃</div>
      <div class="header-text">
        <h1>Halloween Candy Shop</h1>
        <p>Gebruik je snoepjes om XP en een speciale titel te kopen.</p>
      </div>
    </header>

    <section class="currency-card">
      <div class="currency-info">
        <div class="currency-label">Jouw snoepjes</div>
        <div class="currency-value">
          <span class="icon">🍬</span>
          <span class="amount" id="candyAmount">–</span>
        </div>
        <div class="currency-sub">Verdiend door Halloween‑oefeningen te maken.</div>
      </div>
      <div>
        <button class="btn btn-primary" id="refreshBtn">
          <span>Vernieuwen</span>
        </button>
      </div>
    </section>

    <section class="shop-grid" id="shopGrid">
      <!-- items worden via JS ingevuld -->
    </section>

    <section class="status-bar">
      <div class="status-message" id="statusMessage">
        <span class="icon">⏳</span>
        <span class="text">Shop wordt geladen…</span>
      </div>
      <div class="status-message">
        <span class="icon">🔐</span>
        <span class="text">Je moet ingelogd zijn om te kopen.</span>
      </div>
    </section>
  </div>

  <script type="module" src="./halloween-shop.js"></script>
</body>
</html>

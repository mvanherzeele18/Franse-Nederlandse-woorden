<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Events</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --green: #6BBE3A;
  --green-light: #D4E8B8;
  --green-dark: #2E7D32;
  --yellow: #FDD835;
  --bg: #F1F8E9;
  --white: #FFFFFF;
  --text: #1B5E20;

  /* Event kleuren */
  --halloween-orange: #ff6f00;
  --halloween-dark: #3a1f00;

  --disabled-gray: #cccccc;
  --disabled-border: #999999;
}

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: var(--text);
}

/* HEADER (identiek aan Aankondigingen) */
header {
  background: linear-gradient(135deg, var(--green-dark) 0%, var(--green) 100%);
  padding: 2rem;
  border-bottom: 4px solid var(--yellow);
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
}

header h1 {
  font-family: 'Playfair Display', serif;
  color: var(--yellow);
  font-size: 2rem;
}

.nav-btn {
  background: var(--yellow);
  color: var(--green-dark);
  text-decoration: none;
  padding: 0.7rem 1.2rem;
  border-radius: 10px;
  font-weight: 600;
  transition: 0.3s;
}

.nav-btn:hover {
  background: var(--green-light);
  transform: translateY(-2px);
}

@media (max-width: 600px) {
  header {
    flex-direction: column;
    text-align: center;
  }

  .nav-btn {
    width: 100%;
    text-align: center;
  }
}

/* MAIN */
main {
  max-width: 900px;
  margin: 2rem auto;
  padding: 0 1rem;
}

/* Event sectie */
.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 1.6rem;
  margin-bottom: 1rem;
  color: var(--green-dark);
}

/* Event cards */
.event-card {
  background: var(--white);
  border: 3px solid var(--green);
  border-radius: 16px;
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  transition: 0.3s;
}

.event-card:hover {
  transform: translateY(-2px);
}

/* Event titel */
.event-card h2 {
  font-family: 'Playfair Display', serif;
  font-size: 1.4rem;
  margin-bottom: 0.5rem;
}

/* Event uitleg */
.event-card p {
  line-height: 1.6;
}

/* Halloween kleur */
.event-halloween {
  border-color: var(--halloween-orange);
  background: #fff4e6;
}

.event-halloween h2 {
  color: var(--halloween-dark);
}

/* Disabled event */
.event-disabled {
  border-color: var(--disabled-border);
  background: #f2f2f2;
  color: #777;
}

.event-disabled h2 {
  color: #777;
}

.event-btn {
  display: inline-block;
  background: var(--yellow);
  color: var(--green-dark);
  padding: 0.7rem 1.2rem;
  border-radius: 10px;
  font-weight: 600;
  text-decoration: none;
  transition: 0.3s;
  margin-top: 1rem;
}

.event-btn:hover {
  background: var(--green-light);
  transform: translateY(-2px);
}

.event-btn-disabled {
  display: inline-block;
  background: var(--disabled-gray);
  color: #666;
  padding: 0.7rem 1.2rem;
  border-radius: 10px;
  font-weight: 600;
  margin-top: 1rem;
  cursor: not-allowed;
}  
  
</style>
</head>

<body>

<header>
  <h1>Events</h1>
  <a href="../index.html" class="nav-btn">← Terug</a>
</header>

<main>

  <div class="section-title">Volgend event:</div>

  <div class="event-card event-halloween">
    <h2>🎃 Halloween</h2>
    <p>
      Een spooky event met snoepjes, XP‑boosts en speciale titels.
    </p>
  
    <a href="./halloween.html" class="event-btn">Ga naar Event</a>
  </div>

  <div class="section-title">Alle events:</div>

  <!-- Halloween (gemaakt) -->
  <div class="event-card event-halloween">
    <h2>🎃 Halloween</h2>
    <p>
      Een spooky event met snoepjes, XP‑boosts en speciale titels.
    </p>
  </div>

  <!-- Kerst (nog niet gemaakt) -->
  <div class="event-card event-disabled">
    <h2>🎄 Kerst</h2>
    <p>
      Dit event is nog niet beschikbaar.
    </p>
  </div>

  <!-- Pasen (nog niet gemaakt) -->
  <div class="event-card event-disabled">
    <h2>🐣 Pasen</h2>
    <p>
      Dit event is nog niet beschikbaar.
    </p>
  </div>

</main>

</body>
</html>

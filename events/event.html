<!DOCTYPE html>
<html lang="nl">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Event</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{

--green:#6BBE3A;
--green-light:#D4E8B8;
--green-dark:#2E7D32;
--yellow:#FDD835;
--bg:#F1F8E9;
--white:#FFFFFF;
--text:#1B5E20;

}

*{

margin:0;
padding:0;
box-sizing:border-box;

}

body{

font-family:'DM Sans',sans-serif;
background:var(--bg);
min-height:100vh;
color:var(--text);

}

header{

background:linear-gradient(
135deg,
var(--green-dark),
var(--green)
);

padding:2rem;

border-bottom:4px solid var(--yellow);

display:flex;

justify-content:space-between;

align-items:center;

flex-wrap:wrap;

gap:1rem;

}

header h1{

font-family:'Playfair Display',serif;

color:var(--yellow);

font-size:2rem;

}

.nav-btn{

background:var(--yellow);

color:var(--green-dark);

text-decoration:none;

padding:.7rem 1.2rem;

border-radius:10px;

font-weight:600;

transition:.3s;

}

.nav-btn:hover{

background:var(--green-light);

transform:translateY(-2px);

}

main{

max-width:1000px;

margin:2rem auto;

padding:0 1rem;

}

.card{

background:white;

border:3px solid var(--green);

border-radius:16px;

padding:2rem;

box-shadow:0 8px 20px rgba(0,0,0,.08);

margin-bottom:2rem;

}

.card h2{

color:var(--green-dark);

margin-bottom:1rem;

}

.card p{

line-height:1.7;

margin-bottom:1rem;

}

.reward{

background:#eef8e6;

padding:1rem;

border-radius:10px;

margin:.7rem 0;

}

.hidden{

display:none;

}

@media(max-width:600px){

header{

flex-direction:column;

text-align:center;

}

.nav-btn{

width:100%;
text-align:center;

}

}

</style>

</head>

<body>

<header>

<h1 id="eventTitle">
Event
</h1>

<a
href="index.html"
class="nav-btn">

← Terug

</a>

</header>

<main>

<div
class="card"
id="noEvent">

<h2>

Er is momenteel geen event actief

</h2>

<p>

Kom later nog eens terug!

</p>

</div>

<div
class="card hidden"
id="eventContent">

<h2 id="eventName">

Event

</h2>

<p id="eventDescription">

...

</p>

<div
id="eventExtra">

</div>

</div>

</main>
<script type="module">

import {

getCurrentEvent

}

from "./eventManager.js";

const event = getCurrentEvent();

const noEvent =
document.getElementById("noEvent");

const eventContent =
document.getElementById("eventContent");

const eventTitle =
document.getElementById("eventTitle");

const eventName =
document.getElementById("eventName");

const eventDescription =
document.getElementById("eventDescription");

const eventExtra =
document.getElementById("eventExtra");

if(event){

noEvent.classList.add("hidden");

eventContent.classList.remove("hidden");

eventTitle.textContent =
event.name;

eventName.textContent =
event.name;

eventDescription.textContent =
event.description;

switch(event.id){

case "christmas":

eventExtra.innerHTML = `

<h2>🎁 Cadeautjes</h2>

<p>

Maak oefeningen.

Bij elk juist antwoord heb je kans op een cadeautje.

</p>

<div class="reward">

🎁 65% kans → 10 XP

</div>

<div class="reward">

🎁 20% kans → 50 XP

</div>

<div class="reward">

🎁 10% kans → 100 XP

</div>

<div class="reward">

🎁 5% kans → Exclusieve titel

</div>

`;

break;

case "halloween":

eventExtra.innerHTML = `

<h2>🍬 Snoepjes</h2>

<p>

Verdien snoepjes door oefeningen te maken.

Ruil ze later in voor XP of exclusieve titels.

</p>

<h2>

Dagelijkse opdrachten

</h2>

<div class="reward">

Oefen 100 woorden

<br>

Beloning:
10 snoepjes

</div>

<div class="reward">

Maak 3 oefeningen af

<br>

Beloning:
20 snoepjes

</div>

`;

break;

case "easter":

eventExtra.innerHTML = `

<h2>🥚 Paaseieren</h2>

<p>

Iedere dag worden 5 paaseieren opnieuw verstopt.

Klik erop wanneer je ze vindt.

</p>

<div class="reward">

XP

</div>

<div class="reward">

Kleine kans op een exclusieve titel

</div>

`;

break;

case "birthday":

eventExtra.innerHTML = `

<h2>🎉 Verjaardag</h2>

<div class="reward">

✨ Dubbele XP op alle oefeningen

</div>

<div class="reward">

🔥 7 dagen streak = exclusieve titel

</div>

<div class="reward">

🎁 Gratis verjaardagsbeloning

</div>

`;

break;

}

}

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aankondigingen</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root {

  --green: #6BBE3A;
  --green-light: #D4E8B8;
  --green-dark: #2E7D32;
  --yellow: #FDD835;
  --bg: #F1F8E9;
  --white: #FFFFFF;
  --text: #1B5E20;

}

* {

  margin: 0;
  padding: 0;
  box-sizing: border-box;

}

body {

  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  color: var(--text);

}

header {

  background: var(--green-dark);
  padding: 2rem;
  border-bottom: 4px solid var(--yellow);

  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;

}

header h1 {

  font-family: 'Playfair Display', serif;
  color: var(--yellow);
  font-size: 2rem;

}

.back-btn {

  background: var(--yellow);
  color: var(--green-dark);

  text-decoration: none;

  padding: 0.8rem 1.2rem;

  border-radius: 10px;

  font-weight: 600;

  transition: 0.3s;

}

.back-btn:hover {

  background: var(--green-light);
  transform: translateY(-2px);

}

main {

  max-width: 900px;
  margin: 2rem auto;
  padding: 0 1rem;

}

.announcement {

  background: var(--white);

  border: 3px solid var(--green);

  border-radius: 16px;

  padding: 1.5rem;

  margin-bottom: 1.5rem;

  box-shadow:
    0 6px 20px rgba(0,0,0,0.08);

}

.announcement h2 {

  color: var(--green-dark);

  margin-bottom: 0.8rem;

  font-size: 1.3rem;

}

.announcement p {

  line-height: 1.6;

  margin-bottom: 1rem;

}

.date {

  font-size: 0.85rem;

  opacity: 0.7;

}

.delete-btn {

  margin-top: 1rem;

  background: #d32f2f;

  color: white;

  border: none;

  padding: 0.7rem 1rem;

  border-radius: 8px;

  cursor: pointer;

  font-weight: 600;

  transition: 0.3s;

}

.delete-btn:hover {

  background: #b71c1c;

}

.empty {

  text-align: center;

  padding: 3rem;

  color: var(--green-dark);

  font-size: 1.1rem;

}

@media (max-width: 600px) {

  header {

    flex-direction: column;
    align-items: stretch;
    text-align: center;

  }

  .back-btn {

    text-align: center;

  }

}

</style>
</head>

<body>

<header>

  <h1>Aankondigingen</h1>

  <a href="index.html" class="back-btn">
    ← Terug
  </a>

</header>

<main id="announcementContainer">

  <div class="empty">
    Laden...
  </div>

</main>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {

  getAuth,
  onAuthStateChanged

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {

  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot,
  deleteDoc,
  doc

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyBS7uI4tD1XihrIbK2p1cNYGk4b1ipLg3o",
  authDomain: "vocabulairesite.firebaseapp.com",
  projectId: "vocabulairesite",
  storageBucket: "vocabulairesite.firebasestorage.app",
  messagingSenderId: "1002919769364",
  appId: "1:1002919769364:web:face9ebdbe3cb1db37fe01",
  measurementId: "G-5FVEW59WH3"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const adminEmails = [

  "vanherzeelematteo@gmail.com"

];

const container =
document.getElementById("announcementContainer");

let currentUser = null;

onAuthStateChanged(auth, (user) => {

  if (!user) {

    window.location.href =
    "/Franse-Nederlandse-woorden/login.html";

    return;

  }

  currentUser = user;

  loadAnnouncements();

});

function loadAnnouncements() {

  const q = query(

    collection(db, "announcements"),
    orderBy("createdAt", "desc")

  );

  onSnapshot(q, (snapshot) => {

    container.innerHTML = "";

    if (snapshot.empty) {

      container.innerHTML = `

        <div class="empty">
          Nog geen aankondigingen.
        </div>

      `;

      return;

    }

    snapshot.forEach((docSnap) => {

      const data = docSnap.data();

      const div =
      document.createElement("div");

      div.className = "announcement";

      let deleteButton = "";

      if (
        adminEmails.includes(currentUser.email)
      ) {

        deleteButton = `

          <button
            class="delete-btn"
            onclick="deleteAnnouncement('${docSnap.id}')"
          >
            Verwijderen
          </button>

        `;

      }

      div.innerHTML = `

        <h2>${data.title}</h2>

        <p>${data.message}</p>

        <div class="date">

          ${new Date(
            data.createdAt
          ).toLocaleString("nl-BE")}

        </div>

        ${deleteButton}

      `;

      container.appendChild(div);

    });

  });

}

window.deleteAnnouncement = async function(id) {

  if (
    !adminEmails.includes(currentUser.email)
  ) return;

  const confirmed =
  confirm("Verwijder deze aankondiging?");

  if (!confirmed) return;

  await deleteDoc(
    doc(db, "announcements", id)
  );

};

</script>

</body>
</html>

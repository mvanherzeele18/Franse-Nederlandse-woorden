<!DOCTYPE html>
<html lang="nl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registreren</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body {

  font-family:'DM Sans', sans-serif;
  background:#F1F8E9;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;

}

.box {

  background:white;
  padding:3rem;
  border-radius:16px;
  border:3px solid #6BBE3A;
  width:350px;

}

input {

  width:100%;
  padding:12px;
  margin-bottom:1rem;

}

button {

  width:100%;
  padding:12px;
  background:#2E7D32;
  color:white;
  border:none;
  border-radius:8px;

}

</style>

</head>

<body>

<div class="box">

<h1>Registreren</h1>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Wachtwoord">

<button type="button" onclick="register()">

Registreren

</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  sendEmailVerification
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBS7uI4tD1XihrIbK2p1cNYGk4b1ipLg3o",
  authDomain: "vocabulairesite.firebaseapp.com",
  projectId: "vocabulairesite",
  storageBucket: "vocabulairesite.firebasestorage.app",
  messagingSenderId: "1002919769364",
  appId: "1:1002919769364:web:face9ebdbe3cb1db37fe01",
  measurementId: "G-5FVEW59WH3"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.register = async function () {

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  try {

    const userCredential =
await createUserWithEmailAndPassword(
  auth,
  email,
  password
);

await sendEmailVerification(
  userCredential.user
);

alert(
  "Account aangemaakt! Controleer je e-mail voor verificatie."
);

window.location.href = "/Franse-Nederlandse-woorden/login.html";

  } catch (error) {

    if (error.code === "auth/email-already-in-use") {

      alert("Dit email-adres heeft al een account.");

    } else {

      alert(error.message);

    }

  }

}

</script>

</body>
</html>

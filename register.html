<!DOCTYPE html>
<html lang="nl">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Registreren</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <style>

    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      background: #F1F8E9;

      font-family: 'DM Sans', sans-serif;

    }

    .register-box {

      background: white;

      padding: 3rem;

      border-radius: 16px;

      border: 3px solid #6BBE3A;

      width: 360px;

      box-shadow:
      0 8px 24px rgba(107,190,58,0.2);

      text-align: center;

    }

    h1 {

      font-family:
      'Playfair Display', serif;

      color: #2E7D32;

      margin-bottom: 2rem;

    }

    input {

      width: 100%;

      padding: 14px;

      margin-bottom: 1rem;

      border-radius: 8px;

      border: 2px solid #C5E1A5;

      font-size: 1rem;

      box-sizing: border-box;

      transition: all 0.3s;

    }

    input:focus {

      outline: none;

      border-color: #6BBE3A;

      box-shadow:
      0 0 8px rgba(107,190,58,0.2);

    }

    button {

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 8px;

      background: #6BBE3A;

      color: white;

      font-size: 1rem;

      font-weight: 600;

      cursor: pointer;

      transition: all 0.3s;

    }

    button:hover {

      transform: translateY(-2px);

      box-shadow:
      0 4px 12px rgba(107,190,58,0.25);

      background: #81C784;

    }

    .login-link {

      margin-top: 1.5rem;

      display: block;

      color: #2E7D32;

      text-decoration: none;

      font-weight: 500;

      transition: 0.3s;

    }

    .login-link:hover {

      color: #6BBE3A;

    }

    .info {

      color: #558B2F;

      font-size: 0.9rem;

      margin-bottom: 1.5rem;

      line-height: 1.5;

    }

  </style>

</head>

<body>

  <div class="register-box">

    <h1>Registreren</h1>

    <p class="info">

      Maak een account aan om toegang te krijgen tot de oefeningen en vocabulaire.

    </p>

    <input
      type="email"
      id="email"
      placeholder="E-mailadres"
    >

    <input
      type="password"
      id="password"
      placeholder="Wachtwoord"
    >

    <button type="button"
            onclick="register()">

      Account aanmaken

    </button>

    <a class="login-link"
       href="/Franse-Nederlandse-woorden/login.html">

      Heb je al een account? Inloggen

    </a>

  </div>

  <script type="module">

    import { initializeApp }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

    import {

      getAuth,

      createUserWithEmailAndPassword,

      sendEmailVerification

    }
    from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

    const firebaseConfig = {

      apiKey:
      "AIzaSyBS7uI4tD1XihrIbK2p1cNYGk4b1ipLg3o",

      authDomain:
      "vocabulairesite.firebaseapp.com",

      projectId:
      "vocabulairesite",

      storageBucket:
      "vocabulairesite.firebasestorage.app",

      messagingSenderId:
      "1002919769364",

      appId:
      "1:1002919769364:web:face9ebdbe3cb1db37fe01",

      measurementId:
      "G-5FVEW59WH3"

    };

    const app =
    initializeApp(firebaseConfig);

    const auth =
    getAuth(app);

    const allowedDomains = [

      "gmail.com",
      "hotmail.com",
      "outlook.com",
      "live.com",
      "live.be",
      "icloud.com",
      "me.com",
      "mac.com",
      "yahoo.com",
      "telenet.be",
      "proximus.be",
      "skynet.be",
      "groenhoveschool.be"

    ];

    window.register = async function () {

      const email =
      document.getElementById("email").value;
      const domain =
email.split("@")[1]?.toLowerCase();

if(
  !allowedDomains.includes(domain)
){

  alert(
    "Gebruik een geldig e-mailadres."
  );

  return;

}
      const password =
      document.getElementById("password").value;

      try {

        const userCredential =

        await createUserWithEmailAndPassword(

          auth,
          email,
          password

        );

        await sendEmailVerification(
          userCredential.user
        );

        alert(

          "Account aangemaakt! Controleer je e-mail voor verificatie. Bekijk ook je spam."

        );

        window.location.href =
        "/Franse-Nederlandse-woorden/login.html";

      } catch (error) {

        if (
          error.code ===
          "auth/email-already-in-use"
        ) {

          alert(
            "Dit e-mailadres heeft al een account."
          );

        } else if (
          error.code ===
          "auth/weak-password"
        ) {

          alert(
            "Je wachtwoord moet minstens 6 tekens bevatten."
          );

        } else {

          alert(error.message);

        }

      }

    };

  </script>

</body>
</html>

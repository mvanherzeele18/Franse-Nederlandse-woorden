<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oefen Werkwoorden – Nederlands → Frans</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #6BBE3A;
    --green-light: #D4E8B8;
    --green-dark: #2E7D32;
    --yellow: #FDD835;
    --text: #1B5E20;
    --muted: #558B2F;
    --bg: #F1F8E9;
    --white: #FFFFFF;
    --correct: #4CAF50;
    --incorrect: #F44336;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--green-dark);
    padding: 2.5rem 2rem 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 4px solid var(--yellow);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .header-left h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.4rem, 3vw, 2rem);
    color: var(--yellow);
    letter-spacing: 0.02em;
  }

  .header-left p {
    color: var(--green-light);
    font-size: 0.85rem;
    margin-top: 0.3rem;
    font-weight: 300;
  }

  .header-nav {
    display: flex;
    gap: 1rem;
  }

  .nav-btn {
    background: var(--yellow);
    color: var(--green-dark);
    border: none;
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.3s;
    text-decoration: none;
    display: inline-block;
  }

  .nav-btn:hover {
    background: var(--green-light);
    transform: translateY(-2px);
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  .exercise-container {
    background: var(--white);
    border: 2px solid var(--green-light);
    border-radius: 12px;
    padding: 2.5rem;
    animation: fadeIn 0.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .progress-bar {
    background: var(--green-light);
    height: 8px;
    border-radius: 4px;
    margin-bottom: 2rem;
    overflow: hidden;
  }

  .progress-fill {
    background: var(--green);
    height: 100%;
    transition: width 0.3s ease;
  }

  .question-section {
    margin-bottom: 2.5rem;
  }

  .question-label {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .dutch-word {
    font-family: 'Playfair Display', serif;
    font-size: 2.5rem;
    color: var(--green-dark);
    margin-bottom: 2rem;
    text-align: center;
  }

  .input-group {
    display: flex;
    gap: 0.8rem;
    margin-bottom: 1.5rem;
  }

  #answer-input {
    flex: 1;
    padding: 0.9rem 1rem;
    font-size: 1rem;
    border: 2px solid var(--green-light);
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    transition: border-color 0.2s;
  }

  #answer-input:focus {
    outline: none;
    border-color: var(--green);
  }

  .btn {
    padding: 0.9rem 2rem;
    font-size: 1rem;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s;
  }

  .btn-check {
    background: var(--green);
    color: var(--white);
  }

  .btn-check:hover:not(:disabled) {
    background: var(--green-dark);
    transform: translateY(-2px);
  }

  .btn-next {
    background: var(--yellow);
    color: var(--green-dark);
  }

  .btn-next:hover {
    background: #FFC107;
    transform: translateY(-2px);
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .feedback {
    padding: 1.2rem;
    border-radius: 6px;
    margin-bottom: 1.5rem;
    font-weight: 500;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .feedback.correct {
    background: #E8F5E9;
    border-left: 4px solid var(--correct);
    color: var(--correct);
  }

  .feedback.incorrect {
    background: #FFEBEE;
    border-left: 4px solid var(--incorrect);
    color: var(--incorrect);
  }

  .feedback.partial {
    background: #FFF3E0;
    border-left: 4px solid #FF9800;
    color: #E65100;
  }

  .correct-answer {
    display: block;
    margin-top: 0.5rem;
    font-size: 0.9rem;
    opacity: 0.9;
  }

  .results-screen {
    text-align: center;
  }

  .results-screen h2 {
    font-family: 'Playfair Display', serif;
    font-size: 2.5rem;
    color: var(--green-dark);
    margin-bottom: 1.5rem;
  }

  .score-display {
    font-size: 3.5rem;
    font-weight: 700;
    color: var(--green);
    margin-bottom: 1rem;
  }

  .score-label {
    font-size: 1.1rem;
    color: var(--muted);
    margin-bottom: 2rem;
  }

  .results-details {
    background: var(--green-light);
    padding: 1.5rem;
    border-radius: 8px;
    margin-bottom: 2rem;
    text-align: left;
  }

  .results-details p {
    margin: 0.5rem 0;
    font-size: 1rem;
  }

  .btn-back {
    background: var(--green);
    color: var(--white);
    padding: 1rem 2.5rem;
    font-size: 1.05rem;
  }

  .btn-back:hover {
    background: var(--green-dark);
    transform: translateY(-2px);
  }

  .hidden {
    display: none;
  }

  @media (max-width: 768px) {
    header {
      flex-direction: column;
      gap: 1rem;
      align-items: flex-start;
    }

    .header-nav {
      width: 100%;
      gap: 0.5rem;
    }

    .nav-btn {
      flex: 1;
      text-align: center;
    }

    .exercise-container {
      padding: 1.5rem;
    }

    .dutch-word {
      font-size: 2rem;
    }

    .input-group {
      flex-direction: column;
    }

    .btn {
      width: 100%;
    }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Oefen Werkwoorden</h1>
    <p>Nederlands → Frans</p>
  </div>
  <div class="header-nav">
    <a href="nederlands-frans.html" class="nav-btn">← Terug</a>
  </div>
</header>

<main>
  <div class="exercise-container">
    
    <!-- Progress Bar -->
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <!-- Exercise Screen -->
    <div id="exercise-screen">
      <div class="question-section">
        <div class="question-label" id="question-counter">Vraag 1 van X</div>
        <div class="dutch-word" id="dutch-word"></div>
        <div id="feedback-container"></div>
        <div class="input-group">
          <input type="text" id="answer-input" placeholder="Schrijf het Franse woord..." autocomplete="off">
          <button class="btn btn-check" id="check-btn">Controleer</button>
        </div>
        <button class="btn btn-next hidden" id="next-btn">Volgende →</button>
      </div>
    </div>

    <!-- Results Screen -->
    <div id="results-screen" class="hidden results-screen">
      <h2>Oefening voltooid!</h2>
      <div class="score-display" id="final-score">0/0</div>
      <div class="score-label">Goed beantwoord</div>
      <div class="results-details">
        <p><strong>Correct:</strong> <span id="correct-count">0</span> punten</p>
        <p><strong>Half juist:</strong> <span id="partial-count">0</span> × 0.5pt = <span id="partial-points">0</span> punten</p>
        <p><strong>Fout:</strong> <span id="wrong-count">0</span></p>
        <p style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--text);"><strong>Totaalscore:</strong> <span id="total-points">0</span> / <span id="max-points">0</span></p>
      </div>
      <a href="nederlands-frans.html" class="btn btn-back">← Terug naar overzicht</a>
    </div>

  </div>
</main>

<footer>
  © 2026 Vanherzeele Matteo
</footer>
  
<script>
  // EMBEDDED WORD DATA - Werkwoorden
  const werkwoordenData = [{"nl":"aanvaarden","fr":"accepter"},{"nl":"aanzetten","fr":"allumer"},{"nl":"annuleren","fr":"annuler"},{"nl":"bijwonen","fr":"assister à"},{"nl":"chatten","fr":"chatter"},{"nl":"communiceren","fr":"communiquer"},{"nl":"vergelijken","fr":"comparer"},{"nl":"controleren","fr":"contrôler"},{"nl":"geloven","fr":"croire"},{"nl":"ontdekken","fr":"découvrir"},{"nl":"verspreiden","fr":"diffuser"},{"nl":"lastigvallen","fr":"embêter"},{"nl":"sturen","fr":"envoyer"},{"nl":"experimenteren","fr":"expérimenter"},{"nl":"uitzetten","fr":"éteindre"},{"nl":"flirten","fr":"flirter"},{"nl":"pesten","fr":"harceler"},{"nl":"aanzetten tot","fr":"inciter à"},{"nl":"beledigen","fr":"insulter"},{"nl":"bedreigen","fr":"menacer"},{"nl":"kiezen voor","fr":"opter pour"},{"nl":"delen","fr":"partager"},{"nl":"posten","fr":"poster"},{"nl":"beschermen","fr":"protéger"},{"nl":"nadenken","fr":"réfléchir"},{"nl":"weigeren","fr":"refuser"},{"nl":"betreuren, spijt hebben van","fr":"regretter"},{"nl":"respecteren","fr":"respecter"},{"nl":"heruitzenden","fr":"retransmettre"},{"nl":"leunen op / zich baseren op","fr":"s'appuyer sur"},{"nl":"zich excuseren","fr":"s'excuser"},{"nl":"opgelicht worden","fr":"se faire escroquer"},{"nl":"uitlachen, spotten met","fr":"se mocker de"},{"nl":"aandacht schenken aan","fr":"se préoccuper de"},{"nl":"beseffen","fr":"se rendre compte"},{"nl":"een bijnaam geven","fr":"surnommer"},{"nl":"surfen","fr":"surfer"},{"nl":"downloaden","fr":"télécharger"},{"nl":"trukeren","fr":"truquer"},{"nl":"controleren","fr":"vérifier"},{"nl":"stemmen","fr":"voter"}];

  class ExerciseManager {
    constructor(words) {
      this.words = words.sort(() => Math.random() - 0.5);
      this.currentIndex = 0;
      this.results = {
        correct: 0,
        partial: 0,
        wrong: 0,
        answers: []
      };
    }

    getCurrentWord() {
      return this.words[this.currentIndex];
    }

    getProgress() {
      return {
        current: this.currentIndex + 1,
        total: this.words.length,
        percentage: ((this.currentIndex + 1) / this.words.length) * 100
      };
    }

    isLastWord() {
      return this.currentIndex === this.words.length - 1;
    }

    nextWord() {
      if (!this.isLastWord()) {
        this.currentIndex++;
      }
    }

    checkAnswer(userAnswer, correctAnswers) {
      const normalize = (str) => str.toLowerCase().trim();
      const removeAccents = (str) => str.normalize('NFD').replace(/[\u0300-\u036f]/g, '');

      const userNorm = normalize(userAnswer);
      const userNoAccent = removeAccents(userNorm);

      let isExactMatch = false;
      let isAccentOnlyDiff = false;

      for (let correct of correctAnswers) {
        const correctNorm = normalize(correct);
        const correctNoAccent = removeAccents(correctNorm);

        if (userNorm === correctNorm) {
          isExactMatch = true;
          break;
        }

        if (userNoAccent === correctNoAccent && userNorm !== correctNorm) {
          isAccentOnlyDiff = true;
        }
      }

      let result;
      if (isExactMatch) {
        result = 'correct';
        this.results.correct++;
      } else if (isAccentOnlyDiff) {
        result = 'partial';
        this.results.partial++;
      } else {
        result = 'wrong';
        this.results.wrong++;
      }

      this.results.answers.push({
        word: this.getCurrentWord().nl,
        userAnswer,
        correctAnswers,
        result
      });

      return result;
    }

    getResults() {
      const correctPoints = this.results.correct;
      const partialPoints = this.results.partial * 0.5;
      const totalPoints = correctPoints + partialPoints;
      const maxPoints = this.words.length;

      return {
        correct: this.results.correct,
        partial: this.results.partial,
        wrong: this.results.wrong,
        correctPoints,
        partialPoints,
        totalPoints: totalPoints.toFixed(1),
        maxPoints,
        percentage: ((totalPoints / maxPoints) * 100).toFixed(1)
      };
    }
  }

  // UI Manager
  class UIManager {
    constructor() {
      this.exerciseScreen = document.getElementById('exercise-screen');
      this.resultsScreen = document.getElementById('results-screen');
      this.answerInput = document.getElementById('answer-input');
      this.checkBtn = document.getElementById('check-btn');
      this.nextBtn = document.getElementById('next-btn');
      this.feedbackContainer = document.getElementById('feedback-container');
      this.dutchWordDisplay = document.getElementById('dutch-word');
      this.questionCounter = document.getElementById('question-counter');
      this.progressFill = document.getElementById('progress-fill');

      this.checkBtn.addEventListener('click', () => this.handleCheck());
      this.nextBtn.addEventListener('click', () => this.handleNext());
      this.answerInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter' && !this.checkBtn.disabled) this.handleCheck();
      });
    }

    displayWord(word, progress) {
      this.dutchWordDisplay.textContent = word.nl;
      this.questionCounter.textContent = `Vraag ${progress.current} van ${progress.total}`;
      this.progressFill.style.width = progress.percentage + '%';
      this.answerInput.value = '';
      this.feedbackContainer.innerHTML = '';
      this.checkBtn.classList.remove('hidden');
      this.nextBtn.classList.add('hidden');
      this.answerInput.focus();
    }

    showFeedback(result, userAnswer, correctAnswers) {
      const feedback = document.createElement('div');
      feedback.className = `feedback ${result}`;

      if (result === 'correct') {
        feedback.innerHTML = `
          <strong>✓ Correct!</strong>
          <span class="correct-answer">Je antwoord: <em>${userAnswer}</em></span>
        `;
      } else if (result === 'partial') {
        feedback.innerHTML = `
          <strong>⚠ Bijna juist!</strong>
          <span class="correct-answer">Je antwoord: <em>${userAnswer}</em></span>
          <span class="correct-answer">Juist (zonder accentfout): <em>${correctAnswers[0]}</em></span>
        `;
      } else {
        feedback.innerHTML = `
          <strong>✗ Fout</strong>
          <span class="correct-answer">Je antwoord: <em>${userAnswer}</em></span>
          <span class="correct-answer">Juist: <em>${correctAnswers[0]}${correctAnswers.length > 1 ? ' (ook juist: ' + correctAnswers.slice(1).join(', ') + ')' : ''}</em></span>
        `;
      }

      this.feedbackContainer.innerHTML = '';
      this.feedbackContainer.appendChild(feedback);
    }

    enableNext() {
      this.checkBtn.classList.add('hidden');
      this.nextBtn.classList.remove('hidden');
      this.answerInput.disabled = true;
    }

    disableNext() {
      this.answerInput.disabled = false;
    }

    showResults(results) {
      this.exerciseScreen.classList.add('hidden');
      this.resultsScreen.classList.remove('hidden');

      document.getElementById('final-score').textContent = `${results.totalPoints}/${results.maxPoints}`;
      document.getElementById('correct-count').textContent = results.correct;
      document.getElementById('partial-count').textContent = results.partial;
      document.getElementById('partial-points').textContent = results.partialPoints.toFixed(1);
      document.getElementById('wrong-count').textContent = results.wrong;
      document.getElementById('total-points').textContent = results.totalPoints;
      document.getElementById('max-points').textContent = results.maxPoints;
    }

    handleCheck() {}
    handleNext() {}
  }

  // Main App
  class App {
    constructor(manager, ui) {
      this.manager = manager;
      this.ui = ui;
      this.answered = false;

      this.ui.handleCheck = () => this.checkAnswer();
      this.ui.handleNext = () => this.nextQuestion();
    }

    start() {
      this.displayCurrentQuestion();
    }

    displayCurrentQuestion() {
      const word = this.manager.getCurrentWord();
      const progress = this.manager.getProgress();
      this.ui.displayWord(word, progress);
      this.answered = false;
      this.ui.disableNext();
    }

    checkAnswer() {
      if (this.answered) return;

      const word = this.manager.getCurrentWord();
      const userAnswer = this.ui.answerInput.value.trim();

      if (!userAnswer) {
        alert('Vul alstublieft een antwoord in!');
        return;
      }

      // Split multiple answers by "/" or ","
      const correctAnswers = word.fr.split('/').map(a => a.trim());

      const result = this.manager.checkAnswer(userAnswer, correctAnswers);
      this.ui.showFeedback(result, userAnswer, correctAnswers);
      this.ui.enableNext();
      this.answered = true;
    }

    nextQuestion() {
      if (this.manager.isLastWord()) {
        this.endExercise();
      } else {
        this.manager.nextWord();
        this.displayCurrentQuestion();
      }
    }

    endExercise() {
      const results = this.manager.getResults();
      this.ui.showResults(results);
    }
  }

  // Initialize with embedded data
  const manager = new ExerciseManager(werkwoordenData);
  const ui = new UIManager();
  const app = new App(manager, ui);
  app.start();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root {

  --green: #6BBE3A;
  --green-light: #D4E8B8;
  --green-dark: #2E7D32;
  --yellow: #FDD835;
  --bg: #F1F8E9;
  --white: #FFFFFF;

}

* {

  margin:0;
  padding:0;
  box-sizing:border-box;

}

body {

  font-family:'DM Sans', sans-serif;
  background:var(--bg);
  min-height:100vh;

  display:none;

  justify-content:center;
  align-items:center;

  padding:2rem;

}

.box {

  background:var(--white);
  border:3px solid var(--green);
  border-radius:18px;

  padding:3rem;

  width:100%;
  max-width:650px;

  box-shadow:
  0 6px 20px rgba(0,0,0,0.08);

}

h1 {

  font-family:'Playfair Display', serif;
  color:var(--green-dark);

  text-align:center;

  margin-bottom:0.5rem;

}

.subtitle {

  text-align:center;
  color:var(--green-dark);

  margin-bottom:2rem;

}

input,
textarea {

  width:100%;

  padding:1rem;

  border:2px solid var(--green-light);

  border-radius:10px;

  font-family:'DM Sans', sans-serif;

  margin-bottom:1rem;

  font-size:1rem;

}

textarea {

  resize:vertical;
  min-height:140px;

}

input:focus,
textarea:focus {

  outline:none;

  border-color:var(--green);

}

.button-group {

  display:flex;
  flex-direction:column;
  gap:1rem;

}

button {

  background:var(--yellow);

  color:var(--green-dark);

  border:none;

  padding:1rem;

  border-radius:10px;

  font-weight:600;

  cursor:pointer;

  transition:0.3s;

  font-size:0.95rem;

}

button:hover {

  background:var(--green-light);

  transform:translateY(-2px);

}

.users-section {
  margin-top: 2rem;
  padding-top: 2rem;
  border-top: 2px solid var(--green-light);
}

.users-section h2 {
  color: var(--green-dark);
  margin-bottom: 1rem;
  font-family: 'Playfair Display', serif;
}

.users-list {
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
  max-height: 450px;
  overflow-y: auto;
}

.user-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  padding: 0.9rem 1rem;
  background: #f8f8f8;
  border: 1px solid var(--green-light);
  border-radius: 10px;
}

.user-name {
  font-weight: 600;
  color: var(--green-dark);
}

.user-email {
  color: #555;
  font-size: 0.9rem;
  word-break: break-word;
}

.users-status {
  color: var(--green-dark);
  margin-bottom: 1rem;
}

@media (max-width: 600px) {
  .user-row {
    grid-template-columns: 1fr;
    gap: 0.3rem;
  }
}

.secondary-btn {

  background:var(--green);
  color:white;

}

.secondary-btn:hover {

  background:var(--green-dark);

}

</style>
</head>

<body>

<div class="box">

<h1>Admin Panel</h1>

<p class="subtitle">
Welkom Matteo!
</p>

<input
type="text"
id="title"
placeholder="Titel van de aankondiging"
>

<textarea
id="message"
placeholder="Typ hier je aankondiging..."
></textarea>

<div class="button-group">

<button onclick="postAnnouncement()">
Aankondiging plaatsen
</button>

<button
onclick="window.location.href='aankondigingen.html'"
>
Bekijk aankondigingen
</button>

<button
onclick="window.location.href='index.html'"
>
Naar homepage
</button>

<button onclick="logout()">
Uitloggen
</button>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {

  getAuth,
  onAuthStateChanged,
  signOut

}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {

  getFirestore,
  collection,
  addDoc,
  getDocs

}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {

  apiKey: "AIzaSyBS7uI4tD1XihrIbK2p1cNYGk4b1ipLg3o",
  authDomain: "vocabulairesite.firebaseapp.com",
  projectId: "vocabulairesite",
  storageBucket: "vocabulairesite.firebasestorage.app",
  messagingSenderId: "1002919769364",
  appId: "1:1002919769364:web:face9ebdbe3cb1db37fe01",
  measurementId: "G-5FVEW59WH3"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const allowedAdmins = [

  "vanherzeelematteo@gmail.com",
  "vanherzeele.matteo@groenhoveschool.be"

];

onAuthStateChanged(auth, (user) => {

  if (!user) {

    window.location.href =
    "/Franse-Nederlandse-woorden/login.html";

    return;

  }

  if (
    !allowedAdmins.includes(user.email)
  ) {

    alert("Geen toegang");

    window.location.href =
    "/Franse-Nederlandse-woorden/index.html";

    return;

  }

  document.body.style.display = "flex";

  loadUsers();

});

window.logout = async function () {

  await signOut(auth);

  window.location.href =
  "/Franse-Nederlandse-woorden/login.html";

};

async function loadUsers() {

  const status = document.getElementById("usersStatus");
  const list = document.getElementById("usersList");

  status.textContent = "Gebruikers laden...";
  list.innerHTML = "";

  try {

    const snapshot = await getDocs(
      collection(db, "users")
    );

    if (snapshot.empty) {

      status.textContent = "Geen gebruikersprofielen gevonden.";
      return;

    }

    const users = [];

    snapshot.forEach((userDoc) => {

      const data = userDoc.data();

      const name =
        data.displayName ||
        data.name ||
        "Onbekende naam";

      const email =
        data.email ||
        "E-mailadres niet opgeslagen";

      users.push({
        name,
        email
      });

    });

    users.sort((a, b) =>
      a.name.localeCompare(b.name, "nl")
    );

    status.textContent =
      users.length === 1
        ? "1 account"
        : `${users.length} accounts`;

    users.forEach((user) => {

      const row = document.createElement("div");

      row.className = "user-row";

      const name = document.createElement("div");
      name.className = "user-name";
      name.textContent = user.name;

      const email = document.createElement("div");
      email.className = "user-email";
      email.textContent = user.email;

      row.appendChild(name);
      row.appendChild(email);

      list.appendChild(row);

    });

  } catch (error) {

    console.error("Gebruikers konden niet geladen worden:", error);

    status.textContent =
      "Gebruikers konden niet geladen worden.";

  }

}

window.postAnnouncement = async function () {

  const title =
  document.getElementById("title").value;

  const message =
  document.getElementById("message").value;

  if (!title || !message) {

    alert("Vul alles in");
    return;

  }

  try {

    await addDoc(
      collection(db, "announcements"),
      {

        title,
        message,
        createdAt: Date.now()

      }
    );

    alert("Aankondiging geplaatst!");

    document.getElementById("title").value = "";
    document.getElementById("message").value = "";

  } catch (error) {

    console.log(error);

    alert("Error");

  }

};

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root {
  --green: #6BBE3A;
  --green-light: #D4E8B8;
  --green-dark: #2E7D32;
  --yellow: #FDD835;
  --bg: #F1F8E9;
  --white: #FFFFFF;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 2rem;
}

.box {
  background: var(--white);
  border: 3px solid var(--green);
  border-radius: 18px;
  padding: 3rem;
  width: 100%;
  max-width: 650px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}

h1 {
  font-family: 'Playfair Display', serif;
  color: var(--green-dark);
  text-align: center;
  margin-bottom: 0.5rem;
}

.subtitle {
  text-align: center;
  color: var(--green-dark);
  margin-bottom: 2rem;
}

input,
textarea {
  width: 100%;
  padding: 1rem;
  border: 2px solid var(--green-light);
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  margin-bottom: 1rem;
  font-size: 1rem;
}

textarea {
  resize: vertical;
  min-height: 140px;
}

input:focus,
textarea:focus {
  outline: none;
  border-color: var(--green);
}

.button-group {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

button {
  background: var(--yellow);
  color: var(--green-dark);
  border: none;
  padding: 1rem;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
  font-size: 0.95rem;
}

button:hover {
  background: var(--green-light);
  transform: translateY(-2px);
}

.users-section {
  margin-top: 2rem;
  padding-top: 2rem;
  border-top: 2px solid var(--green-light);
}

.users-section h2 {
  color: var(--green-dark);
  margin-bottom: 1rem;
  font-family: 'Playfair Display', serif;
}

.user-search-input {
  padding: 0.6rem 1rem;
  font-size: 0.9rem;
  margin-bottom: 0.8rem;
}

.users-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.user-row {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(120px, 0.9fr) minmax(145px, 1.2fr);
  gap: 0.8rem;
  padding: 0.6rem 0.8rem;
  background: #f8f8f8;
  border: 1px solid var(--green-light);
  border-radius: 10px;
  align-items: center;
  transition: background-color 0.5s ease;
}

/* Visueel effect wanneer een rij recent is geüpdatet */
@keyframes flashUpdate {
  0% { background-color: #a3e4d7; border-color: #1abc9c; }
  100% { background-color: #f8f8f8; border-color: var(--green-light); }
}

.user-row.updated-flash {
  animation: flashUpdate 2s ease-out;
}

.user-email {
  color: #555;
  font-size: 0.85rem;
  word-break: break-word;
}

.user-xp,
.user-title {
  color: var(--green-dark);
  font-size: 0.85rem;
  font-weight: 500;
}

.user-xp {
  white-space: nowrap;
}

.user-title {
  text-align: right;
}

.users-status {
  color: var(--green-dark);
  margin-bottom: 0.5rem;
  font-size: 0.95rem;
}

@media (max-width: 600px) {
  .user-row {
    grid-template-columns: 1fr;
    gap: 0.2rem;
  }

  .user-title {
    text-align: left;
  }
}

.secondary-btn {
  background: var(--green);
  color: white;
}

.secondary-btn:hover {
  background: var(--green-dark);
}

</style>
</head>

<body>

<div class="box">

  <h1>Admin Panel</h1>

  <p class="subtitle">
    Welkom Matteo!
  </p>

  <input
    type="text"
    id="title"
    placeholder="Titel van de aankondiging"
  >

  <textarea
    id="message"
    placeholder="Typ hier je aankondiging..."
  ></textarea>

  <div class="button-group">
    <button onclick="postAnnouncement()">
      Aankondiging plaatsen
    </button>

    <button onclick="window.location.href='aankondigingen.html'">
      Bekijk aankondigingen
    </button>

    <button onclick="window.location.href='index.html'">
      Naar homepage
    </button>

    <button onclick="logout()">
      Uitloggen
    </button>
  </div>

  <div class="users-section">
    <h2>Leerlingen met een account</h2>

    <div id="usersStatus" class="users-status">
      Gebruikers laden...
    </div>

    <input 
      type="text" 
      id="userSearch" 
      class="user-search-input" 
      placeholder="Zoek leerling op e-mail..."
    >

    <div id="usersList" class="users-list"></div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBS7uI4tD1XihrIbK2p1cNYGk4b1ipLg3o",
  authDomain: "vocabulairesite.firebaseapp.com",
  projectId: "vocabulairesite",
  storageBucket: "vocabulairesite.firebasestorage.app",
  messagingSenderId: "1002919769364",
  appId: "1:1002919769364:web:face9ebdbe3cb1db37fe01",
  measurementId: "G-5FVEW59WH3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const allowedAdmins = [
  "vanherzeelematteo@gmail.com",
  "vanherzeele.matteo@groenhoveschool.be"
];

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "/Franse-Nederlandse-woorden/login.html";
    return;
  }

  if (!allowedAdmins.includes(user.email)) {
    alert("Geen toegang");
    window.location.href = "/Franse-Nederlandse-woorden/index.html";
    return;
  }

  document.body.style.display = "flex";

  // Start de real-time listener zodra de admin is ingelogd
  initRealtimeUsers();
});

window.logout = async function () {
  await signOut(auth);
  window.location.href = "/Franse-Nederlandse-woorden/login.html";
};

// Houdt bij welke gebruikers TIJDENS de geopende sessie zijn veranderd
let sessionUpdatesMap = new Map();
let previousUsersMap = new Map();
let currentUsersList = [];

function renderUsers() {
  const list = document.getElementById("usersList");
  const searchQuery = document.getElementById("userSearch").value.toLowerCase().trim();

  list.innerHTML = "";

  const filteredUsers = currentUsersList.filter(user => 
    user.email.toLowerCase().includes(searchQuery)
  );

  filteredUsers.forEach((user) => {
    const row = document.createElement("div");
    row.className = "user-row";

    if (user.isUpdatedNow) {
      row.classList.add("updated-flash");
    }

    const emailDiv = document.createElement("div");
    emailDiv.className = "user-email";
    emailDiv.textContent = user.email;

    const xpDiv = document.createElement("div");
    xpDiv.className = "user-xp";
    xpDiv.textContent = `⭐ ${user.xp} XP · Lv. ${user.level}`;

    const titleDiv = document.createElement("div");
    titleDiv.className = "user-title";
    titleDiv.textContent = `🏅 ${user.title}`;

    row.appendChild(emailDiv);
    row.appendChild(xpDiv);
    row.appendChild(titleDiv);

    list.appendChild(row);
  });
}

// Zoekbalk koppelen
document.getElementById("userSearch").addEventListener("input", renderUsers);

function initRealtimeUsers() {
  const status = document.getElementById("usersStatus");

  status.textContent = "Verbinding maken met live gebruikers...";

  onSnapshot(collection(db, "users"), (snapshot) => {
    if (snapshot.empty) {
      status.textContent = "Geen gebruikersprofielen gevonden.";
      document.getElementById("usersList").innerHTML = "";
      return;
    }

    const users = [];
    const now = Date.now();

    snapshot.forEach((userDoc) => {
      const data = userDoc.data();
      const userId = userDoc.id;

      const email = data.email || "E-mailadres niet opgeslagen";

      const xp = Number.isFinite(Number(data.xp))
        ? Math.max(0, Math.floor(Number(data.xp)))
        : 0;

      function xpForLevel(level) {
        let total = 0;
        for (let i = 1; i < level; i++) {
          total += 100 + ((i - 1) * 50);
        }
        return total;
      }

      function getLevel(xpValue) {
        let level = 1;
        while (xpValue >= xpForLevel(level + 1)) {
          level++;
        }
        return level;
      }

      function getDefaultTitle(level) {
        const titles = [
          { name: "Beginner", minLevel: 1 },
          { name: "Leerling", minLevel: 5 },
          { name: "Student", minLevel: 10 },
          { name: "Gevorderde", minLevel: 20 },
          { name: "Expert", minLevel: 30 },
          { name: "Professor", minLevel: 40 },
          { name: "Meester van het Frans", minLevel: 50 }
        ];

        let title = titles[0].name;
        for (const titleData of titles) {
          if (level >= titleData.minLevel) {
            title = titleData.name;
          }
        }
        return title;
      }

      const level = getLevel(xp);
      const title =
        typeof data.customTitle === "string" && data.customTitle.trim()
          ? data.customTitle.trim()
          : getDefaultTitle(level);

      // Controleer of er een wijziging is t.o.v. de vorige stand in deze geopende sessie
      const prevUser = previousUsersMap.get(userId);
      let isUpdatedNow = false;

      if (prevUser && (prevUser.xp !== xp || prevUser.title !== title)) {
        isUpdatedNow = true;
        sessionUpdatesMap.set(userId, now); // Geef deze gebruiker de huidige tijdstempel
      }

      const lastSessionChange = sessionUpdatesMap.get(userId) || 0;

      users.push({
        id: userId,
        email,
        xp,
        level,
        title,
        lastSessionChange,
        isUpdatedNow
      });
    });

    // SORTERING:
    // 1. Degenen die TIJDENS deze sessie veranderd zijn, komen bovenaan (meest recent eerst)
    // 2. Alle andere leerlingen staan netjes alfabetisch op e-mailadres
    users.sort((a, b) => {
      if (a.lastSessionChange !== b.lastSessionChange) {
        return b.lastSessionChange - a.lastSessionChange;
      }
      return a.email.localeCompare(b.email, "nl");
    });

    status.textContent =
      users.length === 1 ? "1 account (Live)" : `${users.length} accounts (Live)`;

    currentUsersList = users;
    renderUsers();

    // Sla de staat op voor vergelijking bij een volgende snapshot
    previousUsersMap.clear();
    users.forEach(u => previousUsersMap.set(u.id, { xp: u.xp, title: u.title }));

  }, (error) => {
    console.error("Fout bij live ophalen van gebruikers:", error);
    status.textContent = "Fout bij live synchroniseren.";
  });
}

window.postAnnouncement = async function () {
  const title = document.getElementById("title").value;
  const message = document.getElementById("message").value;

  if (!title || !message) {
    alert("Vul alles in");
    return;
  }

  try {
    await addDoc(collection(db, "announcements"), {
      title,
      message,
      createdAt: Date.now()
    });

    alert("Aankondiging geplaatst!");
    document.getElementById("title").value = "";
    document.getElementById("message").value = "";

  } catch (error) {
    console.log(error);
    alert("Error");
  }
};

</script>

</body>
</html>

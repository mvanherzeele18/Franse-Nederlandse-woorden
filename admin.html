<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root {

  --green: #6BBE3A;
  --green-light: #D4E8B8;
  --green-dark: #2E7D32;
  --yellow: #FDD835;
  --bg: #F1F8E9;
  --white: #FFFFFF;

}

* {

  margin: 0;
  padding: 0;
  box-sizing: border-box;

}

body {

  font-family:'DM Sans', sans-serif;
  background: var(--bg);
  min-height: 100vh;

  display: none;

  justify-content: center;
  align-items: center;

  padding: 2rem;

}

.box {

  background: var(--white);

  border: 3px solid var(--green);

  border-radius: 16px;

  padding: 3rem;

  width: 100%;

  max-width: 500px;

  text-align: center;

  box-shadow:
    0 6px 20px rgba(0,0,0,0.08);

}

h1 {

  font-family:'Playfair Display', serif;

  color: var(--green-dark);

  margin-bottom: 1rem;

  font-size: 2rem;

}

p {

  color: var(--green-dark);

  margin-bottom: 2rem;

  font-size: 1rem;

}

.button-group {

  display: flex;

  flex-direction: column;

  gap: 1rem;

}

button {

  background: var(--yellow);

  color: var(--green-dark);

  border: none;

  padding: 1rem 1.4rem;

  border-radius: 10px;

  font-weight: 600;

  cursor: pointer;

  transition: all 0.3s;

  font-size: 0.95rem;

}

button:hover {

  background: var(--green-light);

  transform: translateY(-2px);

  box-shadow:
    0 4px 12px rgba(107,190,58,0.25);

}

@media (max-width: 600px) {

  .box {

    padding: 2rem 1.5rem;

  }

}

</style>
</head>

<body>

<div class="box">

  <h1>Admin Panel</h1>

  <p>
    Welkom Matteo!
  </p>

  <div class="button-group">

    <button onclick="window.location.href='index.html'">
      Naar homepage
    </button>

    <button onclick="logout()">
      Uitloggen
    </button>

  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {

  getAuth,
  onAuthStateChanged,
  signOut

} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const firebaseConfig = {

  apiKey: "AIzaSyBS7uI4tD1XihrIbK2p1cNYGk4b1ipLg3o",
  authDomain: "vocabulairesite.firebaseapp.com",
  projectId: "vocabulairesite",
  storageBucket: "vocabulairesite.firebasestorage.app",
  messagingSenderId: "1002919769364",
  appId: "1:1002919769364:web:face9ebdbe3cb1db37fe01",
  measurementId: "G-5FVEW59WH3"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const allowedAdmins = [

  "vanherzeelematteo@gmail.com",
  "vanherzeele.matteo@groenhoveschool.be"

];

onAuthStateChanged(auth, (user) => {

  if (!user) {

    window.location.href =
    "/Franse-Nederlandse-woorden/login.html";

    return;

  }

  if (
    !allowedAdmins.includes(user.email)
  ) {

    alert("Geen toegang");

    window.location.href =
    "/Franse-Nederlandse-woorden/index.html";

    return;

  }

  document.body.style.display = "flex";

});

window.logout = async function () {

  await signOut(auth);

  window.location.href =
  "/Franse-Nederlandse-woorden/login.html";

};

</script>

</body>
</html>

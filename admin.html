<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Panel</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

:root {
  --green: #6BBE3A;
  --green-light: #D4E8B8;
  --green-dark: #2E7D32;
  --yellow: #FDD835;
  --bg: #F1F8E9;
  --white: #FFFFFF;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  min-height: 100vh;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 2rem;
}

.box {
  background: var(--white);
  border: 3px solid var(--green);
  border-radius: 18px;
  padding: 3rem;
  width: 100%;
  max-width: 650px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.08);
}

h1 {
  font-family: 'Playfair Display', serif;
  color: var(--green-dark);
  text-align: center;
  margin-bottom: 0.5rem;
}

.subtitle {
  text-align: center;
  color: var(--green-dark);
  margin-bottom: 2rem;
}

input,
textarea {
  width: 100%;
  padding: 1rem;
  border: 2px solid var(--green-light);
  border-radius: 10px;
  font-family: 'DM Sans', sans-serif;
  margin-bottom: 1rem;
  font-size: 1rem;
}

textarea {
  resize: vertical;
  min-height: 140px;
}

input:focus,
textarea:focus {
  outline: none;
  border-color: var(--green);
}

.button-group {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

button {
  background: var(--yellow);
  color: var(--green-dark);
  border: none;
  padding: 1rem;
  border-radius: 10px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
  font-size: 0.95rem;
}

button:hover {
  background: var(--green-light);
  transform: translateY(-2px);
}

.users-section {
  margin-top: 2rem;
  padding-top: 2rem;
  border-top: 2px solid var(--green-light);
}

.users-section h2 {
  color: var(--green-dark);
  margin-bottom: 1rem;
  font-family: 'Playfair Display', serif;
}

.user-search-input {
  padding: 0.6rem 1rem;
  font-size: 0.9rem;
  margin-bottom: 1.2rem;
}

.section-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--green-dark);
  margin: 1.2rem 0 0.6rem 0;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  border-bottom: 1px solid var(--green-light);
  padding-bottom: 0.3rem;
}

.users-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.empty-message {
  font-size: 0.85rem;
  color: #777;
  font-style: italic;
  padding: 0.3rem 0;
}

.user-row {
  display: grid;
  grid-template-columns: minmax(0, 1.6fr) minmax(120px, 0.9fr) minmax(145px, 1.2fr);
  gap: 0.8rem;
  padding: 0.6rem 0.8rem;
  background: #f8f8f8;
  border: 1px solid var(--green-light);
  border-radius: 10px;
  align-items: center;
  transition: background-color 0.5s ease;
}

.user-row.active-row {
  background: #f0fdf4;
  border-color: #86efac;
}

@keyframes flashUpdate {
  0% { background-color: #a3e4d7; border-color: #1abc9c; }
  100% { background-color: #f0fdf4; border-color: #86efac; }
}

.user-row.updated-flash {
  animation: flashUpdate 2s ease-out;
}

.user-email {
  color: #333;
  font-size: 0.85rem;
  word-break: break-word;
  display: flex;
  align-items: center;
  gap: 0.4rem;
}

.badge-active {
  background: #22c55e;
  color: white;
  font-size: 0.65rem;
  font-weight: 700;
  padding: 0.15rem 0.4rem;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { opacity: 1; }
  50% { opacity: 0.6; }
  100% { opacity: 1; }
}

.user-xp,
.user-title {
  color: var(--green-dark);
  font-size: 0.85rem;
  font-weight: 500;
}

.user-xp {
  white-space: nowrap;
}

.user-title {
  text-align: right;
}

.users-status {
  color: var(--green-dark);
  margin-bottom: 0.5rem;
  font-size: 0.95rem;
}

@media (max-width: 600px) {
  .user-row {
    grid-template-columns: 1fr;
    gap: 0.2rem;
  }

  .user-title {
    text-align: left;
  }
}

</style>
</head>

<body>

<div class="box">

  <h1>Admin Panel</h1>

  <p class="subtitle">
    Welkom Matteo!
  </p>

  <input
    type="text"
    id="title"
    placeholder="Titel van de aankondiging"
  >

  <textarea
    id="message"
    placeholder="Typ hier je aankondiging..."
  ></textarea>

  <div class="button-group">
    <button onclick="postAnnouncement()">
      Aankondiging plaatsen
    </button>

    <button onclick="window.location.href='aankondigingen.html'">
      Bekijk aankondigingen
    </button>

    <button onclick="window.location.href='index.html'">
      Naar homepage
    </button>

    <button onclick="logout()">
      Uitloggen
    </button>
  </div>

  <div class="users-section">
    <h2>Leerlingen met een account</h2>

    <div id="usersStatus" class="users-status">
      Gebruikers laden...
    </div>

    <input 
      type="text" 
      id="userSearch" 
      class="user-search-input" 
      placeholder="Zoek leerling op e-mail..."
    >

    <!-- Sectie Actieve Leerlingen -->
    <div class="section-title">Actief in de laatste minuut</div>
    <div id="activeUsersList" class="users-list"></div>

    <!-- Sectie Inactieve Leerlingen -->
    <div class="section-title">Inactief</div>
    <div id="inactiveUsersList" class="users-list"></div>
  </div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBS7uI4tD1XihrIbK2p1cNYGk4b1ipLg3o",
  authDomain: "vocabulairesite.firebaseapp.com",
  projectId: "vocabulairesite",
  storageBucket: "vocabulairesite.firebasestorage.app",
  messagingSenderId: "1002919769364",
  appId: "1:1002919769364:web:face9ebdbe3cb1db37fe01",
  measurementId: "G-5FVEW59WH3"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const allowedAdmins = [
  "vanherzeelematteo@gmail.com",
  "vanherzeele.matteo@groenhoveschool.be"
];

onAuthStateChanged(auth, (user) => {
  if (!user) {
    window.location.href = "/Franse-Nederlandse-woorden/login.html";
    return;
  }

  if (!allowedAdmins.includes(user.email)) {
    alert("Geen toegang");
    window.location.href = "/Franse-Nederlandse-woorden/index.html";
    return;
  }

  document.body.style.display = "flex";

  initRealtimeUsers();
});

window.logout = async function () {
  await signOut(auth);
  window.location.href = "/Franse-Nederlandse-woorden/login.html";
};

let sessionUpdatesMap = new Map();
let previousUsersMap = new Map();
let currentRawUsers = [];

function createUserRow(user, isActive) {
  const row = document.createElement("div");
  row.className = "user-row" + (isActive ? " active-row" : "");

  if (user.isUpdatedNow) {
    row.classList.add("updated-flash");
    // Reset direct nadat het element is gemaakt, zodat de timer van 5s geen valse flitsen triggert
    user.isUpdatedNow = false;
  }

  const emailDiv = document.createElement("div");
  emailDiv.className = "user-email";

  const emailSpan = document.createElement("span");
  emailSpan.textContent = user.email;
  emailDiv.appendChild(emailSpan);

  if (isActive) {
    const badge = document.createElement("span");
    badge.className = "badge-active";
    badge.textContent = "🟢 Live";
    emailDiv.appendChild(badge);
  }

  const xpDiv = document.createElement("div");
  xpDiv.className = "user-xp";
  xpDiv.textContent = `⭐ ${user.xp} XP · Lv. ${user.level}`;

  const titleDiv = document.createElement("div");
  titleDiv.className = "user-title";
  titleDiv.textContent = `🏅 ${user.title}`;

  row.appendChild(emailDiv);
  row.appendChild(xpDiv);
  row.appendChild(titleDiv);

  return row;
}

function renderUsers() {
  const activeList = document.getElementById("activeUsersList");
  const inactiveList = document.getElementById("inactiveUsersList");
  const searchQuery = document.getElementById("userSearch").value.toLowerCase().trim();

  activeList.innerHTML = "";
  inactiveList.innerHTML = "";

  const now = Date.now();
  const ONE_MINUTE = 60 * 1000;

  const activeUsers = [];
  const inactiveUsers = [];

  currentRawUsers.forEach(user => {
    if (!user.email.toLowerCase().includes(searchQuery)) return;

    // Check of er in de afgelopen 60 seconden een verandering is geweest
    const timeSinceLastUpdate = now - user.lastSessionChange;
    if (user.lastSessionChange > 0 && timeSinceLastUpdate <= ONE_MINUTE) {
      activeUsers.push(user);
    } else {
      inactiveUsers.push(user);
    }
  });

  // Actief: Meest recent gewijzigd bovenaan
  activeUsers.sort((a, b) => b.lastSessionChange - a.lastSessionChange);

  // Inactief: Alfabetisch
  inactiveUsers.sort((a, b) => a.email.localeCompare(b.email, "nl"));

  // Render Actief
  if (activeUsers.length === 0) {
    activeList.innerHTML = `<div class="empty-message">Geen actieve leerlingen op dit moment.</div>`;
  } else {
    activeUsers.forEach(user => activeList.appendChild(createUserRow(user, true)));
  }

  // Render Inactief
  if (inactiveUsers.length === 0) {
    inactiveList.innerHTML = `<div class="empty-message">Geen inactieve leerlingen.</div>`;
  } else {
    inactiveUsers.forEach(user => inactiveList.appendChild(createUserRow(user, false)));
  }
}

// Elke 5 seconden herberekenen of iemand naar 'Inactief' verplaatst moet worden
setInterval(renderUsers, 5000);

document.getElementById("userSearch").addEventListener("input", renderUsers);

function initRealtimeUsers() {
  const status = document.getElementById("usersStatus");

  status.textContent = "Verbinding maken met live gebruikers...";

  onSnapshot(collection(db, "users"), (snapshot) => {
    if (snapshot.empty) {
      status.textContent = "Geen gebruikersprofielen gevonden.";
      document.getElementById("activeUsersList").innerHTML = "";
      document.getElementById("inactiveUsersList").innerHTML = "";
      return;
    }

    const users = [];
    const now = Date.now();

    snapshot.forEach((userDoc) => {
      const data = userDoc.data();
      const userId = userDoc.id;

      const email = data.email || "E-mailadres niet opgeslagen";

      const xp = Number.isFinite(Number(data.xp))
        ? Math.max(0, Math.floor(Number(data.xp)))
        : 0;

      function xpForLevel(level) {
        let total = 0;
        for (let i = 1; i < level; i++) {
          total += 100 + ((i - 1) * 50);
        }
        return total;
      }

      function getLevel(xpValue) {
        let level = 1;
        while (xpValue >= xpForLevel(level + 1)) {
          level++;
        }
        return level;
      }

      function getDefaultTitle(level) {
        const titles = [
          { name: "Beginner", minLevel: 1 },
          { name: "Leerling", minLevel: 5 },
          { name: "Student", minLevel: 10 },
          { name: "Gevorderde", minLevel: 20 },
          { name: "Expert", minLevel: 30 },
          { name: "Professor", minLevel: 40 },
          { name: "Meester van het Frans", minLevel: 50 }
        ];

        let title = titles[0].name;
        for (const titleData of titles) {
          if (level >= titleData.minLevel) {
            title = titleData.name;
          }
        }
        return title;
      }

      const level = getLevel(xp);
      const title =
        typeof data.customTitle === "string" && data.customTitle.trim()
          ? data.customTitle.trim()
          : getDefaultTitle(level);

      const prevUser = previousUsersMap.get(userId);
      let isUpdatedNow = false;

      // Alleen een flits triggeren als er een échte Firestore-wijziging binnenkomt
      if (prevUser && (prevUser.xp !== xp || prevUser.title !== title)) {
        isUpdatedNow = true;
        sessionUpdatesMap.set(userId, now);
      }

      const lastSessionChange = sessionUpdatesMap.get(userId) || 0;

      users.push({
        id: userId,
        email,
        xp,
        level,
        title,
        lastSessionChange,
        isUpdatedNow
      });
    });

    status.textContent =
      users.length === 1 ? "1 account (Live)" : `${users.length} accounts (Live)`;

    currentRawUsers = users;
    renderUsers();

    previousUsersMap.clear();
    users.forEach(u => previousUsersMap.set(u.id, { xp: u.xp, title: u.title }));

  }, (error) => {
    console.error("Fout bij live ophalen van gebruikers:", error);
    status.textContent = "Fout bij live synchroniseren.";
  });
}

window.postAnnouncement = async function () {
  const title = document.getElementById("title").value;
  const message = document.getElementById("message").value;

  if (!title || !message) {
    alert("Vul alles in");
    return;
  }

  try {
    await addDoc(collection(db, "announcements"), {
      title,
      message,
      createdAt: Date.now()
    });

    alert("Aankondiging geplaatst!");
    document.getElementById("title").value = "";
    document.getElementById("message").value = "";

  } catch (error) {
    console.log(error);
    alert("Error");
  }
};

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mijn Profiel</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

:root{
  --green:#6BBE3A;
  --green-light:#D4E8B8;
  --green-dark:#2E7D32;
  --yellow:#FDD835;
  --bg:#F1F8E9;
  --white:#FFFFFF;
  --text:#1B5E20;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

header{
  background:linear-gradient(
    135deg,
    var(--green-dark) 0%,
    var(--green) 100%
  );

  padding:2rem;

  border-bottom:4px solid var(--yellow);

  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:1rem;
}

header h1{
  font-family:'Playfair Display',serif;
  color:var(--yellow);
  font-size:2rem;
}

.nav-btn{
  background:var(--yellow);
  color:var(--green-dark);
  text-decoration:none;
  padding:0.7rem 1.2rem;
  border-radius:10px;
  font-weight:600;
  transition:0.3s;
}

.nav-btn:hover{
  background:var(--green-light);
  transform:translateY(-2px);
}

main{
  max-width:800px;
  margin:2rem auto;
  padding:0 1rem;
}

.profile-card{
  background:var(--white);
  border:3px solid var(--green);
  border-radius:16px;
  padding:2rem;
  text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,0.08);
}

.avatar{
  font-size:5rem;
  margin-bottom:1rem;
}

.name{
  font-size:2rem;
  font-weight:bold;
  color:var(--green-dark);
}

.email{
  opacity:0.7;
  margin-bottom:2rem;
}

.stat{
  margin-bottom:1.5rem;
}

.label{
  font-size:0.9rem;
  text-transform:uppercase;
  opacity:0.7;
  margin-bottom:0.3rem;
}

.value{
  font-size:2rem;
  font-weight:bold;
  color:var(--green-dark);
}

@media(max-width:600px){

  header{
    flex-direction:column;
    text-align:center;
  }

  .nav-btn{
    width:100%;
    text-align:center;
  }

}

</style>
</head>
<body>

<header>

  <h1>Mijn Profiel</h1>

  <a
    href="index.html"
    class="nav-btn"
  >
    ← Terug
  </a>

</header>

<main>

  <div class="profile-card">

    <div class="avatar">
      👤
    </div>

    <div
      class="name"
      id="name"
    >
      Laden...
    </div>

    <div
      class="email"
      id="email"
    >
      Laden...
    </div>

    <div class="stat">

      <div class="label">
        Titel
      </div>

      <div
        class="value"
        id="title"
      >
        Beginner
      </div>

    </div>

    <div class="stat">

      <div class="label">
        Level
      </div>

      <div
        class="value"
        id="level"
      >
        1
      </div>

    </div>

    <div class="stat">

      <div class="label">
        XP
      </div>

      <div
        class="value"
        id="xp"
      >
        0 XP
      </div>

    </div>

  </div>

</main>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
getFirestore,
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const firebaseConfig = {

  apiKey:"AIzaSyBS7uI4tD1XihrIbK2p1cNYGk4b1ipLg3o",
  authDomain:"vocabulairesite.firebaseapp.com",
  projectId:"vocabulairesite",
  storageBucket:"vocabulairesite.firebasestorage.app",
  messagingSenderId:"1002919769364",
  appId:"1:1002919769364:web:face9ebdbe3cb1db37fe01",
  measurementId:"G-5FVEW59WH3"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);

function getLevel(xp){

  return Math.floor(xp / 100) + 1;

}

function getTitle(level){

  if(level >= 50)
    return "Meester van het Frans";

  if(level >= 40)
    return "Professor";

  if(level >= 30)
    return "Expert";

  if(level >= 20)
    return "Gevorderde";

  if(level >= 10)
    return "Student";

  if(level >= 5)
    return "Leerling";

  return "Beginner";

}

onAuthStateChanged(auth, async(user)=>{

  if(!user) return;

  document.getElementById("name")
  .textContent =
  user.displayName || "Gebruiker";

  document.getElementById("email")
  .textContent =
  user.email;

  let xp = 0;

  const userDoc =
  await getDoc(
    doc(db,"users",user.uid)
  );

  if(userDoc.exists()){

    xp =
    userDoc.data().xp || 0;

  }

  const level =
  getLevel(xp);

  document.getElementById("xp")
  .textContent =
  xp + " XP";

  document.getElementById("level")
  .textContent =
  level;

  document.getElementById("title")
  .textContent =
  getTitle(level);

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mijn Profiel</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --green: #6BBE3A;
  --green-light: #D4E8B8;
  --green-dark: #2E7D32;
  --green-solid: #3B6D11;
  --yellow: #FDD835;
  --bg: #F1F8E9;
  --white: #FFFFFF;
  --text: #1B5E20;
  --text-muted: #5a7a5a;
  --border: #c8e6a0;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
header {
  background: linear-gradient(135deg, var(--green-dark) 0%, var(--green) 100%);
  padding: 1.5rem 2rem;
  border-bottom: 4px solid var(--yellow);
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 1rem;
}
header h1 { font-family: 'Playfair Display', serif; color: var(--yellow); font-size: 2rem; }
.nav-btn {
  background: var(--yellow); color: var(--green-dark);
  text-decoration: none; padding: 0.7rem 1.2rem;
  border-radius: 10px; font-weight: 600; transition: 0.3s;
}
.nav-btn:hover { background: var(--green-light); transform: translateY(-2px); }
main { max-width: 640px; margin: 2rem auto; padding: 0 1rem 3rem; }
.profile-top {
  background: var(--white); border: 2px solid var(--border);
  border-radius: 20px; padding: 2rem; text-align: center;
  margin-bottom: 1.25rem; box-shadow: 0 4px 16px rgba(0,0,0,0.06);
}
.avatar-wrap { position: relative; display: inline-block; margin-bottom: 1rem; }
.avatar-circle {
  width: 80px; height: 80px; border-radius: 50%;
  background: var(--bg); border: 3px solid var(--green);
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5rem; margin: 0 auto;
}
.level-bubble {
  position: absolute; bottom: -4px; right: -4px;
  background: var(--green-dark); color: var(--yellow);
  font-size: 11px; font-weight: 700;
  padding: 3px 8px; border-radius: 20px;
  border: 2px solid var(--white); letter-spacing: 0.03em;
}
.profile-name { font-size: 1.6rem; font-weight: 700; color: var(--green-dark); margin-bottom: 0.2rem; }
.profile-email { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; }
.title-badge {
  display: inline-flex; align-items: center; gap: 6px;
  background: #EAF3DE; color: var(--green-solid);
  border: 1.5px solid #C0DD97;
  font-size: 0.85rem; font-weight: 600;
  padding: 5px 14px; border-radius: 20px;
}
.title-badge.admin { background: #FFF8E1; color: #7B5800; border-color: #FFE082; }
.xp-card {
  background: var(--white); border: 2px solid var(--border);
  border-radius: 20px; padding: 1.5rem;
  margin-bottom: 1.25rem; box-shadow: 0 4px 16px rgba(0,0,0,0.06);
}
.xp-card-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 0.75rem; }
.section-title { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--text-muted); font-weight: 600; }
.xp-numbers { font-size: 0.85rem; color: var(--text-muted); }
.xp-numbers strong { color: var(--green-dark); }
.xp-track {
  height: 14px; background: var(--bg);
  border-radius: 7px; border: 1.5px solid var(--border);
  overflow: hidden; margin-bottom: 0.4rem;
}
.xp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--green) 0%, var(--green-dark) 100%);
  border-radius: 7px; transition: width 1s cubic-bezier(.4,0,.2,1); width: 0%;
}
.xp-hint { font-size: 0.78rem; color: var(--text-muted); text-align: right; }
.stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 1rem; margin-bottom: 1.25rem; }
.stat-box {
  background: var(--white); border: 2px solid var(--border);
  border-radius: 16px; padding: 1.1rem 0.75rem;
  text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.06);
}
.stat-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); font-weight: 600; margin-bottom: 0.4rem; }
.stat-value { font-size: 1.7rem; font-weight: 700; color: var(--green-dark); line-height: 1; }
.stat-value.small { font-size: 1.15rem; }
.titles-card {
  background: var(--white); border: 2px solid var(--border);
  border-radius: 20px; padding: 1.5rem;
  box-shadow: 0 4px 16px rgba(0,0,0,0.06);
}
.titles-card .section-title { margin-bottom: 1rem; }
.title-row {
  display: flex; align-items: center; gap: 12px;
  padding: 0.55rem 0; border-bottom: 1px solid #f0f7e8; font-size: 0.9rem;
}
.title-row:last-child { border-bottom: none; }
.t-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.t-dot.done   { background: var(--green); }
.t-dot.next   { background: #D4E8B8; border: 2px solid var(--green); }
.t-dot.future { background: #eee; border: 2px solid #ccc; }
.t-name { flex: 1; }
.t-name.done   { color: var(--green-dark); font-weight: 500; }
.t-name.future { color: #aaa; }
.t-lvl { font-size: 0.78rem; color: var(--text-muted); }
.t-check { font-size: 1rem; color: var(--green); font-weight: 700; }
@media (max-width: 480px) {
  header { flex-direction: column; text-align: center; }
  .nav-btn { width: 100%; text-align: center; }
  .stats-grid { grid-template-columns: 1fr 1fr; }
  .stat-value { font-size: 1.4rem; }
}
</style>
</head>
<body>

<header>
  <h1>Mijn Profiel</h1>
  <a href="index.html" class="nav-btn">← Terug</a>
</header>

<main>

  <div class="profile-top">
    <div class="avatar-wrap">
      <div class="avatar-circle">👤</div>
      <div class="level-bubble" id="level-bubble">Lv. 1</div>
    </div>
    <div class="profile-name" id="name">Laden...</div>
    <div class="profile-email" id="email">Laden...</div>
    <div class="title-badge" <span id="title-badge">Beginner</span></div>
  </div>

  <div class="xp-card">
    <div class="xp-card-header">
      <span class="section-title">Voortgang</span>
      <span class="xp-numbers">
        <strong id="xp-cur">0</strong> / <span id="xp-max">100</span> XP
      </span>
    </div>
    <div class="xp-track">
      <div class="xp-fill" id="xp-bar"></div>
    </div>
    <div class="xp-hint" id="xp-hint">Nog 100 XP tot level 2</div>
  </div>

  <div class="stats-grid">
    <div class="stat-box">
      <div class="stat-label">Totaal XP</div>
      <div class="stat-value" id="stat-xp">0</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Level</div>
      <div class="stat-value" id="stat-level">1</div>
    </div>
    <div class="stat-box">
      <div class="stat-label">Nog nodig</div>
      <div class="stat-value small" id="stat-needed">100 XP</div>
    </div>
  </div>

  <div class="titles-card">
    <div class="section-title">Titels</div>
    <div id="titles-list"></div>
  </div>

</main>

<script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getFirestore,
  doc,
  getDoc
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyBS7uI4tD1XihrIbK2p1cNYGk4b1ipLg3o",
  authDomain:"vocabulairesite.firebaseapp.com",
  projectId:"vocabulairesite",
  storageBucket:"vocabulairesite.firebasestorage.app",
  messagingSenderId:"1002919769364",
  appId:"1:1002919769364:web:face9ebdbe3cb1db37fe01",
  measurementId:"G-5FVEW59WH3"
};

const ADMIN_EMAIL =
"vanherzeelematteo@gmail.com";

const TITLES = [

  { name:"Beginner", minLevel:1 },
  { name:"Leerling", minLevel:5 },
  { name:"Student", minLevel:10 },
  { name:"Gevorderde", minLevel:20 },
  { name:"Expert", minLevel:30 },
  { name:"Professor", minLevel:40 },
  { name:"Meester van het Frans", minLevel:50 }

];

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const auth =
getAuth(app);

function xpForLevel(level){

  let xp = 0;

  for(let i = 1; i < level; i++){

    xp += 100 + ((i - 1) * 50);

  }

  return xp;

}

function getLevel(xp){

  let level = 1;

  while(xp >= xpForLevel(level + 1)){

    level++;

  }

  return level;

}

function getTitle(level){

  let title = TITLES[0].name;

  for(const t of TITLES){

    if(level >= t.minLevel){

      title = t.name;

    }

  }

  return title;

}

function renderProfile(xp,isAdmin){

  const level =
  getLevel(xp);

  const currentLevelXP =
  xpForLevel(level);

  const nextLevelXP =
  xpForLevel(level + 1);

  const xpInsideLevel =
  xp - currentLevelXP;

  const xpNeededThisLevel =
  nextLevelXP - currentLevelXP;

  const xpRemaining =
  nextLevelXP - xp;

  const progress =
  Math.round(
    (xpInsideLevel / xpNeededThisLevel)
    * 100
  );

  const displayTitle =
  isAdmin
  ? "Admin"
  : getTitle(level);


  document.getElementById(
    "level-bubble"
  ).textContent =
  isAdmin
  ? "Admin"
  : "Lv. " + level;

  const badge =
  document.getElementById(
    "title-badge-wrap"
  );

  badge.innerHTML =
  badgeIcon +
  " <span>" +
  displayTitle +
  "</span>";

  badge.className =
  isAdmin
  ? "title-badge admin"
  : "title-badge";

  document.getElementById(
    "xp-cur"
  ).textContent =
  xpInsideLevel;

  document.getElementById(
    "xp-max"
  ).textContent =
  xpNeededThisLevel;

  document.getElementById(
    "xp-hint"
  ).textContent =
  "Nog " +
  xpRemaining +
  " XP tot level " +
  (level + 1);

  setTimeout(()=>{

    document.getElementById(
      "xp-bar"
    ).style.width =
    progress + "%";

  },100);

  document.getElementById(
    "stat-xp"
  ).textContent =
  xp;

  document.getElementById(
    "stat-level"
  ).textContent =
  level;

  document.getElementById(
    "stat-needed"
  ).textContent =
  xpRemaining + " XP";

  const list =
  document.getElementById(
    "titles-list"
  );

  list.innerHTML = "";

  const nextTitle =
  TITLES.find(
    t => level < t.minLevel
  );

  for(const t of TITLES){

    const unlocked =
    level >= t.minLevel;

    const isNext =
    !unlocked &&
    nextTitle &&
    nextTitle.name === t.name;

    const dotClass =
    unlocked
    ? "done"
    : (isNext ? "next" : "future");

    const row =
    document.createElement("div");

    row.className =
    "title-row";

    row.innerHTML =

      `<div class="t-dot ${dotClass}"></div>
       <span class="t-name ${unlocked ? "done" : "future"}">
         ${t.name}
       </span>
       <span class="t-lvl">
         Lv. ${t.minLevel}
       </span>
       ${unlocked ? '<span class="t-check">✓</span>' : ''}`;

    list.appendChild(row);

  }

}

onAuthStateChanged(
  auth,
  async(user)=>{

    if(!user) return;

    document.getElementById(
      "name"
    ).textContent =
    user.displayName ||
    "Gebruiker";

    document.getElementById(
      "email"
    ).textContent =
    user.email;

    let xp = 0;

    const userDoc =
    await getDoc(
      doc(
        db,
        "users",
        user.uid
      )
    );

    if(userDoc.exists()){

      xp =
      userDoc.data().xp || 0;

    }

    const isAdmin =
    user.email === ADMIN_EMAIL;

    renderProfile(
      xp,
      isAdmin
    );

  }
);

</script>
</body>
</html>
